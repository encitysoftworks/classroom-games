<title>Hunter's Contract</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Pinyon+Script&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<!--
  Hunter's Contract: a small gothic boss-rush action game (retro 3D, PSX look), keyboard only.
  Built on the Classroom Game Kit + retro 3D add-on. Do not edit inside the KIT blocks:
  run  python3 game-kit/update-kit.py --no-words "hunters-contract/Hunters Contract.html"  to refresh them.
  New bosses: add one entry to BOSSES (data: hp, moves with hit times) plus a body builder.
-->
<style>
/*KIT:CSS START*/
/* =====================================================================
   CLASSROOM GAME KIT  v1  styles
   Paste between the KIT:CSS markers (or run update-kit.py).
   A game restyles itself by changing the tokens below in its own :root block AFTER the kit.
   One dark "game console" look on purpose, like The Keypad Game.
   ===================================================================== */
:root{
  --bg:#14161d; --panel:#1e212b; --panel2:#272b37; --edge:#3a3f50; --text:#f2eee5; --muted:#aeacba; --dim:#7d7b8c;
  --accent:#ff7a3d; --ink:#1b1a17; --go:#7fd18b; --oops:#ff8f6b; --paper:#fffaf0;
  --f-display:"Bungee","Arial Black",Impact,sans-serif;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  --f-letter:"Andika","Century Gothic","Trebuchet MS",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
html{background:var(--bg)}
body{margin:0;background:var(--bg);background-image:radial-gradient(1000px 480px at 50% -10%,#262a3a 0%,rgba(20,22,29,0) 65%);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.5}
.app{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 40px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.15;text-wrap:balance}
h3{font-size:15px;letter-spacing:.04em}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Japanese support: <span class="ja"> shows only when body.jp */
.ja{display:none}
body.jp .ja{display:block;font-size:.82em;color:var(--muted);line-height:1.45;font-weight:500;letter-spacing:0;font-family:var(--f-body)}
body.jp .ja.inl{display:inline;margin-left:6px}

/* buttons + switches */
.btn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:700 15px/1.25 var(--f-body);color:var(--text);background:var(--panel2);border:2px solid var(--edge);border-radius:8px;padding:9px 16px;cursor:pointer;box-shadow:0 3px 0 #07080b;text-align:center}
.btn:hover{border-color:var(--dim)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #07080b}
.btn.primary{background:var(--accent);color:var(--ink);border-color:color-mix(in srgb,var(--accent) 60%,#000)}
.btn.primary .ja{color:inherit;opacity:.78}
.btn.small{font-size:13px;padding:6px 10px}
.btn.big{font-size:18px;padding:13px 24px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tog{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--edge);border-radius:20px;padding:5px 12px 5px 8px;cursor:pointer;font-size:13px;font-weight:700}
.tog::before{content:"";width:28px;height:16px;border-radius:9px;background:var(--edge);flex:none}
.tog[aria-pressed="true"]::before{background:var(--go);background-image:radial-gradient(circle at 21px 8px,#fff 5px,transparent 5.5px)}
.tog[aria-pressed="false"]::before{background-image:radial-gradient(circle at 7px 8px,#cfc8de 5px,transparent 5.5px)}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:4px 8px;border-bottom:2px dashed var(--edge);margin-bottom:12px}
.brand{background:none;border:0;cursor:pointer;display:flex;align-items:baseline;gap:10px;padding:4px 0;font-family:var(--f-display);font-size:22px;color:var(--accent)}
.brand span{font:700 13px var(--f-body);color:var(--muted)}
.tb-tools{display:flex;gap:8px;flex-wrap:wrap}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:24px;align-items:center;margin-bottom:20px}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:800;margin-bottom:6px}
.hero h1{font-size:clamp(38px,6vw,64px);text-shadow:0 4px 0 #000}
.hero .lead{font-size:18px;margin-top:10px;max-width:34em}
.hero-pic{display:flex;justify-content:center}
.hero-pic svg{width:min(260px,100%);height:auto}
.panel{background:var(--panel);border:2px solid var(--edge);border-radius:12px;padding:16px 18px;box-shadow:0 4px 0 #07080b;min-width:0}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}
.role{display:flex;flex-direction:column;gap:8px}
.role h2{font-size:22px;color:var(--accent)}
.role .who{font-weight:800;color:var(--muted);font-size:14px}
.role .btn{align-self:flex-start}
.say{list-style:none;padding:0;margin:2px 0 4px;display:flex;flex-wrap:wrap;gap:6px}
.say li{background:var(--panel2);border-radius:6px;padding:4px 10px;font-weight:700;font-size:15px}
.say li::before{content:"\201C";color:var(--accent);margin-right:2px}.say li::after{content:"\201D";color:var(--accent);margin-left:2px}
.more{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.note{color:var(--muted);font-size:14px}

/* settings rows (Kit.seg) */
.settings{display:flex;flex-direction:column;gap:12px}
.set-row{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.set-row h3{min-width:140px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{display:flex;flex-direction:column;align-items:center;background:var(--panel2);border:2px solid var(--edge);border-radius:8px;padding:6px 12px;font-weight:700;font-size:14px;cursor:pointer;line-height:1.2}
.seg button .ja{font-size:11px}
.seg button small{font:400 12px var(--f-letter);opacity:.85;max-width:12em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.seg button[aria-pressed="true"] .ja{color:inherit;opacity:.78}
details.custom{border-top:2px dashed var(--edge);padding-top:10px}
details.custom summary{cursor:pointer;font-weight:800;color:var(--accent);font-size:15px;margin-bottom:6px}

/* class code */
.classcode{display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px;border-top:2px dashed var(--edge);padding-top:12px}
.cc{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cc b{font-family:var(--f-display);font-size:30px;letter-spacing:.12em;color:var(--accent);font-weight:400}
.kit-cname,.cc-name{color:var(--muted);font-weight:700;font-size:14px}
.kit-entry{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:auto}
.kit-entry input{width:9em;font:400 18px var(--f-display);letter-spacing:.12em;text-transform:uppercase;background:var(--bg);color:var(--text);border:2px solid var(--edge);border-radius:8px;padding:6px 10px}
.kit-err{color:var(--oops);font-weight:700;font-size:14px;width:100%}
.kit-err:empty{display:none}

/* HUD */
.hud{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;background:var(--panel);border:2px solid var(--edge);border-radius:12px;padding:6px 12px;margin-bottom:8px}
.rolechip{font:800 13px var(--f-body);background:var(--accent);color:var(--ink);border-radius:14px;padding:3px 12px;text-transform:uppercase;letter-spacing:.05em}
.lights{display:flex;gap:6px;align-items:center}
.lights i{width:18px;height:18px;border-radius:50%;background:#3d2a26;border:2px solid #000;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
.lights i.on{background:var(--go)}
.lights i.now{background:var(--oops)}
.stat{font:700 15px var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums}
.stat b{color:var(--text);font-family:var(--f-display);font-weight:400;font-size:18px;margin-left:4px}
.hud .badge{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700}
.hud .badge b{font-family:var(--f-display);font-weight:400;color:var(--accent);letter-spacing:.1em;font-size:16px}
.phrases{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.phrases b{font-size:13px;color:var(--muted);margin-right:4px}
.phrases span.p{background:var(--panel2);border-radius:6px;padding:3px 9px;font-weight:700;font-size:14px}
.display.shake,.kit-shake{animation:kit-shake .4s}
@keyframes kit-shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* solo partner */
.kit-partner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel2);border:2px solid var(--edge);border-radius:10px;padding:8px 12px}
.kit-robot{font-size:30px;line-height:1}
.kit-bub{flex:1;min-width:0;font-weight:800;font-size:17px}
.kit-bub .ja{font-weight:500}

/* traps (no flashing: movement and sound only) */
.kit-trap-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5;border-radius:12px}
.kit-trap-layer.block{pointer-events:auto;cursor:default}
.kt{position:absolute;line-height:1;user-select:none}
.kt-wordwrap{transform:translateX(-50%);z-index:2}
.kt-word{display:flex;flex-direction:column;align-items:center;font-family:var(--f-display);font-size:40px;color:#fff;-webkit-text-stroke:2px #000;text-shadow:0 4px 0 #000;white-space:nowrap;animation:kt-pop .35s ease-out both}
body.jp .kt-word .ja{-webkit-text-stroke:0;text-shadow:none;font-size:16px;color:#fff;background:rgba(0,0,0,.6);border-radius:6px;padding:2px 8px;text-align:center}
@keyframes kt-pop{from{transform:scale(.3)}70%{transform:scale(1.12)}to{transform:scale(1)}}
.kit-pic{image-rendering:pixelated;vertical-align:middle}
.kt .kit-pic{display:block}
.kt-glove{font-size:90px;animation:kt-glove 2s ease-in-out both}
@keyframes kt-glove{0%{transform:translate(-50%,-50%) scale(.2)}35%{transform:translate(-50%,-50%) scale(2.4)}50%{transform:translate(-50%,-50%) scale(1.9)}65%{transform:translate(-50%,-50%) scale(2.3)}85%{transform:translate(-50%,-50%) scale(2.2);opacity:1}100%{transform:translate(-50%,-50%) scale(.2);opacity:0}}
.kt-chicken{font-size:120px;bottom:-140px;animation:kt-chick 2.4s ease-in-out both}
@keyframes kt-chick{0%{transform:translateY(0)}25%{transform:translateY(-180px) rotate(-8deg)}40%{transform:translateY(-170px) rotate(8deg)}55%{transform:translateY(-180px) rotate(-8deg)}75%{transform:translateY(-175px) rotate(6deg)}100%{transform:translateY(0)}}
.kt-soot{width:120px;height:110px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#3b3b3f,#141416 70%,rgba(20,20,22,0) 72%);cursor:pointer;pointer-events:auto;transition:opacity .35s,transform .35s}
.kt-soot.gone{opacity:0;transform:scale(.4);pointer-events:none}
.kt-hint{left:50%;transform:translateX(-50%);bottom:10px;background:rgba(0,0,0,.78);border-radius:8px;padding:6px 14px;font-weight:800;text-align:center;white-space:nowrap}
.kt-duck{font-size:100px;bottom:20px;left:-130px;animation:kt-duck 3s linear both}
@keyframes kt-duck{0%{transform:translateX(0) rotate(-5deg)}12%{transform:translateX(120px) rotate(5deg)}25%{transform:translateX(250px) rotate(-5deg)}37%{transform:translateX(370px) rotate(5deg)}50%{transform:translateX(500px) rotate(-5deg)}62%{transform:translateX(620px) rotate(5deg)}75%{transform:translateX(750px) rotate(-5deg)}87%{transform:translateX(870px) rotate(5deg)}100%{transform:translateX(1000px)}}
.kt-drop{font-size:38px;animation:kt-drop 1.4s ease-in both}
@keyframes kt-drop{from{transform:translate(0,0)}to{transform:translate(var(--dx),var(--dy));opacity:.2}}
.kt-bear{font-size:130px;left:50%;bottom:-150px;animation:kt-bear 2.8s ease-in-out both}
@keyframes kt-bear{0%{transform:translate(-50%,0)}25%,75%{transform:translate(-50%,-190px)}50%{transform:translate(-50%,-182px)}100%{transform:translate(-50%,0)}}
.kt-zz{font:400 34px var(--f-display);color:#cfe3ff;animation:kt-zz 2.4s ease-out both}
@keyframes kt-zz{from{transform:translate(0,0);opacity:0}20%{opacity:1}to{transform:translate(40px,-110px);opacity:0}}
.kt-cat{font-size:130px;cursor:pointer;pointer-events:auto;animation:kt-catin .5s ease-out both}
@keyframes kt-catin{from{transform:translateY(-60px);opacity:0}to{transform:none;opacity:1}}
.kt-cat.bye{animation:kt-catout .6s ease-in both}
@keyframes kt-catout{to{transform:translateX(400px)}}
.kt-heart{font-size:34px;animation:kt-zz 1.2s ease-out both}

/* end screen */
.kit-result{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.kit-rtitle{font-size:clamp(30px,5vw,48px)}
.kit-stars{display:flex;gap:6px}.kit-stars svg{width:46px;height:46px}
.kit-nums{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.kit-nums div{background:var(--panel);border:2px solid var(--edge);border-radius:10px;padding:8px 16px;min-width:110px}
.kit-nums small{display:block;color:var(--muted);font-weight:700;font-size:13px}
.kit-nums b{font-family:var(--f-display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.kit-swap{display:flex;align-items:center;gap:14px;background:var(--accent);color:var(--ink);border-radius:12px;padding:12px 20px;font-family:var(--f-display);font-size:26px}
.kit-swap .ja{color:inherit;opacity:.78}
.kit-swap svg{width:54px;height:54px;flex:none}

/* teacher page */
.kit-teacher{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.kit-tcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.kit-th{font-size:24px;color:var(--accent);margin-bottom:8px}
.kit-steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.kit-share{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.kit-bigcode{font-family:var(--f-display);font-size:54px;letter-spacing:.14em;color:var(--accent);line-height:1}
.kit-qr{background:#fff;border-radius:8px;padding:6px;line-height:0}
.kit-qr canvas{width:220px;height:220px;image-rendering:pixelated}
.kit-link{width:100%;box-sizing:border-box;font:13px var(--f-body);background:var(--bg);color:var(--text);border:2px solid var(--edge);border-radius:8px;padding:6px 8px}
.kit-pairs h3{margin-bottom:8px}
.kit-pairrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.kit-npairs{width:4.5em;font:700 16px var(--f-body);background:var(--bg);color:var(--text);border:2px solid var(--edge);border-radius:8px;padding:4px 8px}
.kit-codes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kit-codecard{background:var(--panel2);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column}
.kit-codecard b{font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.08em;color:var(--accent)}
.kit-copyarea{width:100%;box-sizing:border-box;margin-top:8px;background:var(--bg);color:var(--text);border:2px solid var(--edge);border-radius:8px}
.kit-veil{position:fixed;inset:0;background:rgba(8,9,12,.92);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.kit-veil-card{background:var(--panel);border:2px solid var(--edge);border-radius:14px;padding:22px;max-width:720px;width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.kit-veil .kit-bigcode{font-size:clamp(60px,14vw,150px)}
.kit-vurl{word-break:break-all}
.kit-toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--go);color:var(--ink);font-weight:800;border-radius:10px;padding:8px 16px;z-index:60;box-shadow:0 4px 0 #000}
.kit-toast .ja{color:#1f3b24}

/* ===== other game styles ===== */
/* countdown ring */
.kit-count{position:relative;width:96px;height:96px;flex:none}
.kit-count svg{width:100%;height:100%;transform:rotate(-90deg)}
.kit-count circle{fill:none;stroke-width:9}
.kc-bg{stroke:var(--panel2)}
.kc-fg{stroke:var(--go);stroke-dasharray:100;stroke-linecap:round;transition:stroke-dashoffset .1s linear}
.kit-count.low .kc-fg{stroke:var(--oops)}
.kit-count b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 34px var(--f-display);font-variant-numeric:tabular-nums}
/* team scoreboard */
.kit-teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kit-team{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;align-items:center;gap:2px 10px;background:var(--panel);border:3px solid var(--tc);border-radius:12px;padding:8px 12px}
.kit-team .kt-em{font-size:40px;line-height:1;grid-row:span 2}
.kit-team .kt-nm{font-weight:800;color:var(--tc)}
.kit-team b{font:400 42px/1 var(--f-display);grid-row:span 2;font-variant-numeric:tabular-nums}
.kit-team .kt-btns{display:flex;gap:6px}
.kit-team.bump b{animation:kt-pop .35s ease-out}
/* quiz */
.kq{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.kq-prompt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;background:var(--paper);color:var(--ink);border-radius:14px;padding:14px;text-align:center}
.kq-em{font-size:110px;line-height:1.05}
.kq-ear{font-size:80px;line-height:1}
.kq-listen{font:400 26px var(--f-display)}
.kq-word{font:700 clamp(44px,8vw,84px)/1.1 var(--f-letter)}
.kq-ja{font:800 clamp(40px,7vw,72px)/1.2 var(--f-body)}
body.jp .kq-prompt .ja{color:#6b6358}
.kq-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kq-c{display:flex;align-items:center;gap:12px;min-height:76px;background:var(--key,#f6f1e3);color:var(--ink);border:3px solid transparent;border-radius:12px;box-shadow:0 5px 0 #8f8873,0 6px 0 #000;cursor:pointer;padding:8px 14px;font:700 clamp(20px,3vw,32px)/1.15 var(--f-letter);text-align:left;overflow-wrap:anywhere}
.kq-c:active{transform:translateY(4px);box-shadow:0 1px 0 #8f8873,0 2px 0 #000}
.kq-c i{font:400 22px var(--f-display);font-style:normal;color:#8a8270;flex:none;width:1.2em}
.kq-c span{flex:1;min-width:0}
.kq-cem{font-size:52px;line-height:1}
.kq-c.picked{border-color:var(--accent)}
.kq-c.right{background:#c9f0cf;border-color:#2f8a4a}
.kq-c.wrong{background:#ffe0d4;border-color:var(--oops)}
.kq-c.dim{opacity:.4}
/* bingo card */
.kit-bingo{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:6px;max-width:620px;margin:0 auto}
.kit-bingo button{position:relative;aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--paper);color:var(--ink);border:3px solid #d9d0bd;border-radius:10px;cursor:pointer;padding:4px;font:700 14px/1.1 var(--f-letter);overflow:hidden;overflow-wrap:anywhere;text-align:center}
.kit-bingo .bem{font-size:clamp(28px,6vw,52px);line-height:1}
.kit-bingo .bja{font:800 clamp(14px,2.6vw,22px)/1.2 var(--f-body)}
.kit-bingo button.on{border-color:var(--accent)}
.kit-bingo button.on::after{content:"";position:absolute;inset:12%;border-radius:50%;background:color-mix(in srgb,var(--accent) 45%,transparent);border:4px solid var(--accent);animation:kt-pop .25s ease-out}
.kit-bingo button.free{background:var(--accent);font-family:var(--f-display);font-weight:400}
.kit-bingo button.called{box-shadow:inset 0 0 0 4px var(--go)}

/* retro 3D stage (Kit3D): the canvas is drawn small and scaled up with crisp pixels */
.k3d-stage{position:relative;width:100%;aspect-ratio:16/10;max-width:100%;background:#000;border-radius:12px;overflow:hidden}
.k3d-canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}

@media (max-width:820px){
  .hero,.roles,.kit-teacher{grid-template-columns:minmax(0,1fr)}
  .hero-pic{display:none}
  .kit-entry{margin-left:0}
  .set-row h3{min-width:0;width:100%}
  .kq-choices{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
  .kt-glove,.kt-chicken,.kt-duck,.kt-bear{animation-duration:2.2s}
}
/*KIT:CSS END*/
</style>
<style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/*KIT:JS START*/
/* =====================================================================
   CLASSROOM GAME KIT  v1
   Shared parts for Wyatt's English classroom games (pair, team, whole-class or solo) (single-file HTML, Chromebooks, no server).
   Everything lives on window.Kit. Paste this file between the KIT:JS markers of a game
   (or run update-kit.py). Read README.md for the how-to.

   Parts
     Kit.$ / $$ / esc / bi / store(prefix)          DOM helpers, English+Japanese pairs, localStorage
     Kit.mulberry32 / hash32 / hashStr / rng / ri / shuffle / pickN / RND / randomSeeds
     Kit.codec({...})                                short class codes or pair codes, link#CODE
     Kit.link                                        the game's share link (handles the artifact URL)
     Kit.qr(canvas, text, px)                        QR code (needs the qrcode-generator script tag)
     Kit.sound / Kit.speech                          beeps and funny sounds, computer voice
     Kit.toggle / Kit.setupToggles                   日本語サポート and Sound switches (body.jp)
     Kit.seg                                         a row of pick-one buttons for settings
     Kit.screens                                     one <section class="screen"> at a time
     Kit.toast                                       small message at the bottom
     Kit.timer / fmtTime / score                     time + mistakes scoring and stars
     Kit.traps({...})                                funny traps for wrong answers (no flashing)
     Kit.codeEntry / Kit.badges                      "type the class code" box, code badges
     Kit.teacher({...})                              teacher page: code, QR, link, projector, pair codes
     Kit.result({...})                               end screen: stars, numbers, optional Swap roles!
     Kit.soloPartner({...})                          the computer partner bubble for solo practice
     Kit.words                                       textbook word bank (grade / book / unit picker)
   Other game styles (whole class, teams, solo drills)
     Kit.keys / Kit.fullscreen                       keyboard shortcuts and fullscreen for the projector
     Kit.countdown({...})                            countdown ring (no flashing)
     Kit.teams({...})                                team scoreboard with big +1 buttons
     Kit.quiz                                        multiple-choice questions from the word bank (5 types)
     Kit.bingo                                       bingo cards, calling order, line check
   ===================================================================== */
(function(){
"use strict";
const Kit={version:1};

/* ---------- DOM + text ---------- */
Kit.$=(s,r=document)=>r.querySelector(s);
Kit.$$=(s,r=document)=>[...r.querySelectorAll(s)];
Kit.esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* bi(["English","日本語"]) -> English with Japanese under it (shown only when body.jp). inline=true keeps it on one line. */
Kit.bi=(p,inline)=>`<span class="en">${p[0]}</span><span class="ja${inline?" inl":""}">${p[1]||""}</span>`;
Kit.store=prefix=>({
  get(k,d){try{const v=localStorage.getItem(prefix+"_"+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(prefix+"_"+k,JSON.stringify(v));}catch(e){}}
});
const $=Kit.$,$$=Kit.$$,bi=Kit.bi;

/* ---------- seeded random ----------
   rng(seed, salt) gives the same numbers on every Chromebook, so partners' screens match.
   RND is for things that should differ (which page a bomb picks, key order). */
Kit.mulberry32=function(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};};
Kit.hash32=function(x){x|=0;x=Math.imul(x^(x>>>16),0x7feb352d);x=Math.imul(x^(x>>>15),0x846ca68b);return(x^(x>>>16))>>>0;};
Kit.hashStr=function(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return Kit.hash32(h);};
Kit.rng=(...parts)=>{let h=0x51ed27;for(const p of parts)h=Kit.hash32(h^(typeof p==="number"?Kit.hash32(p):Kit.hashStr(String(p))));return Kit.mulberry32(h);};
Kit.ri=(r,n)=>Math.floor(r()*n);
Kit.shuffle=(a,r)=>{for(let i=a.length-1;i>0;i--){const j=Kit.ri(r,i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
Kit.pickN=(r,arr,n)=>Kit.shuffle(arr.slice(),r).slice(0,n);
Kit.RND=Kit.mulberry32((Date.now()^(Math.random()*4294967296))>>>0);
Kit.randomSeeds=function(n,max){const a=new Uint32Array(n),used=new Set(),out=[];
  try{crypto.getRandomValues(a);}catch(e){for(let i=0;i<n;i++)a[i]=(Math.random()*4294967296)>>>0;}
  for(let i=0;i<n;i++){let s=a[i]%max;while(used.has(s))s=(s+1)%max;used.add(s);out.push(s);}return out;};
/* a bag: hands out items in random order with no repeats until all are used */
Kit.bag=(items,r)=>{let b=[];return ()=>{if(!b.length)b=Kit.shuffle(items.slice(),r||Kit.RND);return b.shift();};};

/* ---------- codes ----------
   Kit.codec({game:"pl", fields:[{k:"level",n:3},{k:"rounds",n:5,min:1}], seed:0, check:32})
     game    a short id; codes from one game never load in another
     fields  settings, each with n possible values (min..min+n-1). Order matters: only ever ADD fields at the END,
             and give them a default (def) so old codes keep working is NOT possible; adding a field changes codes.
             So pick generous n up front (e.g. n:16 for "unit").
     seed    0 for a class code (settings only, everyone in class types the same code, like The Keypad Game);
             a number like 262144 for pair codes (each pair gets its own puzzle, like The Maze Game).
     check   how many checksum values (32 = one typo in 32 slips through)
   Returns {encode(S, seed) -> "K7QM", decode(str) -> {S, seed, code} | null, fmt(code), length, fromHash()} */
const ALPH="23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
Kit.ALPH=ALPH;
Kit.codec=function(o){
  const fields=o.fields||[],SEEDS=BigInt(o.seed||1),C=BigInt(o.check||32),gid=Kit.hashStr("kit:"+(o.game||"game"));
  let N=1n;for(const f of fields)N*=BigInt(f.n);
  const M=N*SEEDS;let L=1;while(32n**BigInt(L)<M*C)L++;
  if(o.length&&o.length>L)L=o.length;
  const big=x=>{const lo=Number(x&0xFFFFFFFFn),hi=Number((x>>32n)&0xFFFFFFFFn);return Kit.hash32(lo^Kit.hash32(hi^gid));};
  const mix=c=>((BigInt(Kit.hash32(gid^(Number(c)*7919+101)))<<32n)|BigInt(Kit.hash32(gid+Number(c)*104729)))%M;
  function encode(S,seed){
    let x=0n;for(const f of fields){const v=(S[f.k]??f.def??f.min??0)-(f.min||0);if(!(v>=0&&v<f.n))throw new Error("Kit.codec: "+f.k+" out of range");x=x*BigInt(f.n)+BigInt(v);}
    x=x*SEEDS+BigInt(seed||0)%SEEDS;
    const c=BigInt(big(x))%C;let v=c*M+(x+mix(c))%M,out="";
    for(let i=0;i<L;i++){out=ALPH[Number(v%32n)]+out;v/=32n;}return out;
  }
  function clean(str){return (str||"").toUpperCase().replace(/[\s\-_.]/g,"").replace(/O/g,"0").replace(/I/g,"1");}
  function decode(str){
    const s=clean(str);if(s.length!==L)return null;
    let v=0n;for(const ch of s){const i=ALPH.indexOf(ch);if(i<0)return null;v=v*32n+BigInt(i);}
    if(v>=C*M)return null;
    const c=v/M,x=((v%M)-mix(c)+M)%M;if(BigInt(big(x))%C!==c)return null;
    let rest=x;const seed=Number(rest%SEEDS);rest/=SEEDS;const vals=[],S={};
    for(let i=fields.length-1;i>=0;i--){const n=BigInt(fields[i].n);vals[i]=Number(rest%n)+(fields[i].min||0);rest/=n;}
    fields.forEach((f,i)=>S[f.k]=vals[i]);
    if(o.valid&&!o.valid(S))return null;
    return {S,seed,code:s};
  }
  const fmt=c=>c.length>=6?c.slice(0,Math.ceil(c.length/2)-(c.length===7?1:0))+"-"+c.slice(Math.ceil(c.length/2)-(c.length===7?1:0)):c;
  function fromHash(){try{return decode(decodeURIComponent((location.hash||"").replace(/^#/,"")));}catch(e){return null;}}
  return {encode,decode,fmt,fromHash,length:L,fields};
};

/* ---------- the game's share link ----------
   Inside claude.ai the page runs in a sandbox, so we use the artifact URL you pass in.
   Hosted anywhere else (GitHub Pages later), it uses its own address. */
Kit.link={
  base(artifactUrl){try{const h=location.hostname||"";if(/^https?:$/.test(location.protocol)&&h&&!/claude|anthropic|claudeusercontent/i.test(h))return location.origin+location.pathname;}catch(e){}return artifactUrl||"";},
  withCode(base,code){return base?base.replace(/#.*$/,"")+(code?"#"+code:""):"";}
};

/* ---------- QR code (needs <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js">) ---------- */
Kit.qr=function(cv,text,px){
  if(typeof window.qrcode!=="function"||!text||!cv)return false;
  try{const q=window.qrcode(0,"M");q.addData(text);q.make();
    const n=q.getModuleCount(),size=n+8,scale=Math.max(2,Math.floor(px/size));
    cv.width=cv.height=size*scale;const g=cv.getContext("2d");
    g.fillStyle="#fff";g.fillRect(0,0,cv.width,cv.height);g.fillStyle="#000";
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))g.fillRect((c+4)*scale,(r+4)*scale,scale,scale);
    return true;}catch(e){return false;}
};

/* ---------- sound ----------
   Kit.sound.play("boing"). Add your own with Kit.sound.add("name", ()=>{tone(...)}).
   Built in: click key bump ok nope boing bawk achoo wipe splash quack snore boo meow purr done win */
const sound={on:true,_ac:null};
sound.ac=function(){if(!sound._ac){try{sound._ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){sound._ac=null;}}const a=sound._ac;if(a&&a.state==="suspended")a.resume().catch(()=>{});return a;};
sound.tone=function(f,dur,type,vol,f2,delay){
  const a=sound.on&&sound.ac();if(!a)return;
  try{const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
  o.type=type||"square";o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol||0.05,t);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.02);}catch(e){}
};
sound.noise=function(dur,vol,delay){const a=sound.on&&sound.ac();if(!a)return;try{const len=Math.floor(a.sampleRate*dur),buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const src=a.createBufferSource(),g=a.createGain();src.buffer=buf;g.gain.value=vol;src.connect(g);g.connect(a.destination);src.start(a.currentTime+(delay||0));}catch(e){}};
const tone=sound.tone,noise=sound.noise;
const SFX={
  click:()=>tone(900,0.04,"triangle",0.04,700),
  key:()=>tone(660,0.05,"square",0.03,520),
  bump:()=>tone(110,0.12,"sawtooth",0.04,80),
  ok:()=>{tone(523,0.12,"triangle",0.05);tone(784,0.2,"triangle",0.05,null,0.1);},
  nope:()=>{tone(330,0.15,"square",0.04,300);tone(220,0.25,"square",0.04,200,0.15);},
  boing:()=>{tone(140,0.45,"sine",0.12,700);tone(700,0.4,"sine",0.08,180,0.3);},
  bawk:()=>[0,0.22,0.44].forEach(d=>tone(760,0.16,"sawtooth",0.04,520,d)),
  achoo:()=>{tone(500,0.3,"triangle",0.05,700);noise(0.4,0.12,0.35);},
  wipe:()=>noise(0.12,0.05),
  splash:()=>{noise(0.6,0.12);tone(900,0.3,"sine",0.03,300,0.05);},
  quack:()=>[0,0.35,0.7,1.05].forEach(d=>tone(330,0.14,"square",0.05,240,d)),
  snore:()=>{tone(70,0.9,"sawtooth",0.06,95);tone(95,0.9,"sawtooth",0.05,70,1.1);},
  boo:()=>{tone(180,0.7,"sine",0.07,90);tone(240,0.7,"triangle",0.04,120,0.05);},
  meow:()=>tone(650,0.45,"triangle",0.06,900),
  purr:()=>tone(60,0.35,"sawtooth",0.04,55),
  done:()=>[523,659,784].forEach((f,i)=>tone(f,0.18,"triangle",0.05,null,i*0.09)),
  win:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,0.22,"square",0.04,null,i*0.11));tone(1318,0.5,"triangle",0.05,null,0.46);}
};
sound.play=n=>{if(SFX[n])SFX[n]();};
sound.add=(n,fn)=>{SFX[n]=fn;};
Kit.sound=sound;

/* ---------- computer voice ---------- */
const speech={can:(()=>{try{return "speechSynthesis" in window&&typeof SpeechSynthesisUtterance==="function";}catch(e){return false;}})(),voice:null,_t:[]};
speech.pick=function(){try{const vs=speechSynthesis.getVoices();speech.voice=vs.find(v=>/^en[-_]US/i.test(v.lang)&&/google|samantha|natural/i.test(v.name))||vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}catch(e){}};
if(speech.can){speech.pick();try{speechSynthesis.onvoiceschanged=speech.pick;}catch(e){}}
speech.say=function(t,rate){if(!speech.can||!sound.on)return false;try{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";if(speech.voice)u.voice=speech.voice;u.rate=rate||0.85;speechSynthesis.speak(u);return true;}catch(e){return false;}};
/* say each item with a pause between (for "Slowly") */
speech.sayEach=function(list,gap,rate){speech.hush();list.forEach((w,i)=>speech._t.push(setTimeout(()=>speech.say(w,rate||0.75),i*(gap||1300))));return speech.can&&sound.on;};
speech.hush=function(){speech._t.forEach(clearTimeout);speech._t=[];try{speech.can&&speechSynthesis.cancel();}catch(e){}};
Kit.speech=speech;

/* ---------- switches ----------
   Kit.toggle(button, store, "jp", true, on=>{...}) keeps aria-pressed and the saved value in step.
   Kit.setupToggles(store, {jp:"#jpToggle", snd:"#sndToggle"}) wires the two standard ones. */
Kit.toggle=function(btn,st,key,def,onChange){
  if(typeof btn==="string")btn=$(btn);let v=st.get(key,def);
  const apply=()=>{if(btn)btn.setAttribute("aria-pressed",String(v));onChange&&onChange(v);};
  if(btn)btn.addEventListener("click",()=>{v=!v;st.set(key,v);sound.play("click");apply();});
  apply();return {get value(){return v;},set(x){v=!!x;st.set(key,v);apply();}};
};
Kit.setupToggles=function(st,sel){
  const out={};
  out.jp=Kit.toggle(sel.jp||"#jpToggle",st,"jp",sel.jpDefault??true,on=>document.body.classList.toggle("jp",on));
  out.snd=Kit.toggle(sel.snd||"#sndToggle",st,"snd",true,on=>{sound.on=on;if(!on)speech.hush();});
  return out;
};

/* ---------- pick-one buttons: Kit.seg(el, [{html, ...}], (o,i)=>isOn, (o,i)=>onPick) ---------- */
Kit.seg=function(el,opts,isOn,onPick){
  if(typeof el==="string")el=$(el);
  el.innerHTML=opts.map((o,i)=>`<button type="button" data-i="${i}" aria-pressed="${!!isOn(o,i)}">${o.html}</button>`).join("");
  $$("button",el).forEach(b=>b.onclick=()=>{sound.ac();sound.play("click");onPick(opts[+b.dataset.i],+b.dataset.i);});
};

/* ---------- screens: <section class="screen" id="home">. Kit.screens({onShow(id,prev)}) ---------- */
Kit.screens=function(o){
  const api={current:null,show(id){const prev=api.current;$$(".screen").forEach(el=>el.hidden=el.id!==id);api.current=id;
    speech.hush();o&&o.onShow&&o.onShow(id,prev);window.scrollTo(0,0);}};
  return api;
};

/* ---------- toast ---------- */
let toastT=0;
Kit.toast=function(html,ms){let el=$("#kitToast");if(!el){el=document.createElement("div");el.id="kitToast";el.className="kit-toast";el.setAttribute("role","status");document.body.appendChild(el);}
  el.innerHTML=html;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,ms||2600);};

/* ---------- time + mistakes ----------
   Kit.score({elapsed, oops, par}) : 1000 points, minus 100 per oops, minus 4 per second over par. Never below 100.
   Stars: 850+ = 3, 600+ = 2, otherwise 1. Every finished game gets at least one star. */
Kit.fmtTime=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
Kit.timer=function(onTick){
  let t0=0,iv=0,el=0,run=false;
  const api={start(){t0=performance.now();el=0;run=true;clearInterval(iv);iv=setInterval(()=>{el=(performance.now()-t0)/1000;onTick&&onTick(el,Kit.fmtTime(el));},250);onTick&&onTick(0,"0:00");},
    stop(){if(run)el=(performance.now()-t0)/1000;run=false;clearInterval(iv);iv=0;return el;},
    get elapsed(){return run?(performance.now()-t0)/1000:el;},get running(){return run;}};
  return api;
};
Kit.score=function(o){
  const over=Math.max(0,(o.elapsed||0)-(o.par||60));
  const score=Math.max(100,Math.round((1000-(o.oops||0)*(o.perOops??100)-over*(o.perSec??4))/10)*10);
  return {score,stars:score>=850?3:score>=600?2:1};
};
Kit.STAR=on=>`<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4l5.9 12.6 13.7 1.6-10.1 9.4 2.7 13.6L24 34.4l-12.2 6.8 2.7-13.6L4.4 18.2l13.7-1.6z" fill="${on?"#ffd23f":"none"}" stroke="${on?"#9a6f00":"#5b5f70"}" stroke-width="3" stroke-linejoin="round"/></svg>`;

/* ---------- funny traps ----------
   const T=Kit.traps({layer:"#trapLayer", target:"#chest", area:"#keys"});
   T.next(done)   plays a random trap (no repeats until all used), then calls done()
   T.run("cat",done) plays one by name.  T.clear() stops everything (call it when leaving the screen).
   layer = an empty .kit-trap-layer placed inside a position:relative stage.
   target = the thing being worked on (traps aim at it); area = the buttons (traps cover them for 2-3 seconds).
   All movement and sound, nothing flashes. Names: glove chicken soot water duck bear cat (+ any you add with T.add). */
Kit.traps=function(o){
  const layer=typeof o.layer==="string"?$(o.layer):o.layer;
  const R=o.rng||Kit.RND,ri=n=>Kit.ri(R,n);let timers=[];
  const later=(fn,ms)=>timers.push(setTimeout(fn,ms));
  const clear=()=>{timers.forEach(clearTimeout);timers=[];layer.innerHTML="";layer.classList.remove("block");};
  const el=(cls,html,css)=>{const d=document.createElement("div");d.className="kt "+cls;d.innerHTML=html;Object.assign(d.style,css||{});layer.appendChild(d);return d;};
  const word=(w,left,top)=>el("kt-wordwrap",`<div class="kt-word">${w[0]}<span class="ja">${w[1]||""}</span></div>`,{left,top});
  const box=sel=>{const s=layer.getBoundingClientRect(),e=(typeof sel==="string"?$(sel):sel);if(!e)return {x:s.width/4,y:s.height/4,w:s.width/2,h:s.height/2};const b=e.getBoundingClientRect();return {x:b.left-s.left,y:b.top-s.top,w:b.width,h:b.height};};
  const tc=()=>{const b=box(o.target);return {x:b.x+b.w/2,y:b.y+b.h/2};},ar=()=>box(o.area);
  const play=sound.play;
  /* drawn sprite from the pictures add-on when the game has it, emoji otherwise */
  const art=(n,e,px)=>Kit.art?Kit.art("trap:"+n,e,px):e;
  const T={
    glove(done){const c=tc();layer.classList.add("block");play("boing");el("kt-glove",art("glove","\u{1F94A}",96),{left:c.x+"px",top:c.y+"px"});word(["BOING!","ボヨーン！"],"50%","8%");later(()=>{clear();done();},2100);},
    chicken(done){layer.classList.add("block");play("bawk");const k=ar();el("kt-chicken",art("chicken","\u{1F414}",128),{left:(k.x+k.w/2-60)+"px"});word(["BAWK!","コケーッ！"],"50%","8%");later(()=>{clear();done();},2500);},
    soot(done){
      play("achoo");const c=tc();word(["ACHOO!","ハックション！"],c.x+"px","6%");layer.classList.add("block");let fin=false;
      const finish=()=>{if(fin)return;fin=true;clear();done();};
      later(()=>{const k=ar();let left=0;
        for(let i=0;i<6;i++){const d=el("kt-soot","",{left:(k.x+(i%3)*k.w/3+ri(30))+"px",top:(k.y+Math.floor(i/3)*k.h/2+ri(20))+"px"});left++;
          d.onclick=()=>{if(d.classList.contains("gone"))return;d.classList.add("gone");play("wipe");left--;if(!left)finish();};}
        el("kt-hint",bi(["Click the soot to wipe it off!","すすをクリックしてふき取ろう！"]),{});
        later(finish,10000);},700);
    },
    water(done){layer.classList.add("block");play("splash");const k=ar();
      for(let i=0;i<16;i++){const d=el("kt-drop",art("drop","\u{1F4A7}",40),{left:(10+ri(60))+"px",top:(10+ri(60))+"px",animationDelay:(i*0.05)+"s"});d.style.setProperty("--dx",(k.x+ri(Math.max(40,k.w)))+"px");d.style.setProperty("--dy",(k.y+ri(Math.max(40,k.h)))+"px");}
      word(["SPLASH!","バシャッ！"],"50%","8%");later(()=>{clear();done();},2200);},
    duck(done){layer.classList.add("block");play("quack");el("kt-duck",art("duck","\u{1F986}",104),{});word(["QUACK! QUACK!","ガーガー！"],"50%","8%");later(()=>{clear();done();},3000);},
    bear(done){layer.classList.add("block");play("snore");el("kt-bear",art("bear","\u{1F43B}",136),{});
      for(let i=0;i<3;i++)el("kt-zz","Z",{left:"55%",top:"40%",animationDelay:(i*0.6)+"s"});
      word(["ZZZ... SNORE!","グーグー…"],"50%","8%");later(()=>{clear();done();},2800);},
    cat(done){
      play("meow");const k=ar();layer.classList.add("block");let pets=0,fin=false;
      const cat=el("kt-cat",art("cat","\u{1F431}",136),{left:(k.x+k.w/2-65)+"px",top:(k.y+k.h/2-75)+"px"});
      const hint=el("kt-hint",bi(["Pet the cat 3 times to move it!","ネコを3回なでて、どいてもらおう！"]),{});
      const bye=()=>{if(fin)return;fin=true;play("meow");cat.classList.add("bye");hint.remove();later(()=>{clear();done();},650);};
      cat.onclick=()=>{if(fin)return;pets++;play("purr");el("kt-heart",art("heart","\u{1F497}",40),{left:(k.x+k.w/2+ri(40)-20)+"px",top:(k.y+k.h/2-80)+"px"});if(pets>=3)bye();};
      later(bye,12000);
    }
  };
  let names=o.names||Object.keys(T),bag=Kit.bag(names,R);
  return {
    run(n,done){clear();(T[n]||T.glove)(done||(()=>{}));},
    next(done){this.run(bag(),done);},
    add(n,fn){T[n]=(done)=>fn(done,{el,word,later,clear,tc,ar,layer,rng:R});names=names.concat(n);bag=Kit.bag(names,R);},
    use(list){names=list;bag=Kit.bag(names,R);},
    clear,word,el,later,get names(){return Object.keys(T);}
  };
};

/* ---------- textbook word bank ----------
   Data: the JSON script tag with id kit-wordbank (copied from textbook-db/all-books.json by update-kit.py).
   Book order is the order in all-books.json. Codes store the book's position, so only ADD books at the end.
     Kit.words.books()                     [{i, name, grade, gradeLabel:[en,ja], units:[...]}]
     Kit.words.pick({book, from, to}, {needEmoji, minWords})  -> {words:[{en,ja,emoji}], phrases:[], units:[...]}
     Kit.words.label(sel)                  ["Let's Try! 2 · Unit 4", "小4 Let's Try! 2 Unit 4"]
     Kit.words.fields                      codec fields: book (8), from (16), to (16)
     Kit.words.picker(mount, sel, onChange, {needEmoji})  grade + book + unit range controls */
const GRADE=g=>{const m=/^(ES|JHS)(\d)$/.exec(g||"");if(!m)return [g||"",g||""];return m[1]==="ES"?["Grade "+m[2],"小"+m[2]]:["JHS "+m[2],"中"+m[2]];};
const words={_d:null};
words.load=function(){if(words._d)return words._d;let d={books:[]};try{const el=document.getElementById("kit-wordbank");if(el)d=JSON.parse(el.textContent);}catch(e){}
  words._d=(d.books||[]).map((b,i)=>({i,name:b.book,grade:b.grade,gradeLabel:GRADE(b.grade),units:(b.units||[]).map(u=>Object.assign({},u,{words:(u.words||[]).filter(w=>w&&w.en)}))}));return words._d;};
words.books=()=>words.load();
words.book=i=>words.load()[i]||null;
words.fields=[{k:"book",n:8,def:0},{k:"from",n:16,def:0},{k:"to",n:16,def:0}];
words.clamp=function(sel){const bs=words.load();const b=bs[sel.book]?sel.book:0,n=bs[b]?bs[b].units.length:1;let f=Math.min(sel.from||0,n-1),t=Math.min(sel.to??f,n-1);if(t<f)t=f;return {book:b,from:f,to:t};};
words.pick=function(sel,opt){opt=opt||{};const s=words.clamp(sel),b=words.book(s.book);if(!b)return {words:[],phrases:[],units:[]};
  const units=b.units.slice(s.from,s.to+1),seen=new Set(),out=[];let phrases=[];
  units.forEach(u=>{phrases=phrases.concat(u.phrases||[]);u.words.forEach(w=>{const k=w.en.toLowerCase();if(seen.has(k))return;if(opt.needEmoji&&!w.emoji)return;seen.add(k);out.push(w);});});
  return {words:out,phrases,units,book:b};};
words.label=function(sel){const s=words.clamp(sel),b=words.book(s.book);if(!b)return ["No word bank","単語データなし"];
  const u=b.units,us=s.from===s.to?"Unit "+u[s.from].unit:"Units "+u[s.from].unit+"–"+u[s.to].unit;
  return [b.name+" · "+us,b.gradeLabel[1]+" "+b.name+" "+us.replace("Units","Unit")];};
words.picker=function(mount,sel,onChange,opt){
  if(typeof mount==="string")mount=$(mount);opt=opt||{};const bs=words.load();
  const cur=()=>words.clamp(sel);
  function render(){
    const s=cur(),b=bs[s.book];
    mount.innerHTML=`<div class="set-row"><h3>${bi(["Book","教科書"])}</h3><div class="seg kw-book"></div></div>
     <div class="set-row"><h3>${bi(["Unit","ユニット"])}</h3><div class="seg kw-unit"></div></div>
     <p class="note kw-info"></p>`;
    Kit.seg($(".kw-book",mount),bs.map(x=>({html:`${x.gradeLabel[0]}<small>${Kit.esc(x.name)}</small><span class="ja">${x.gradeLabel[1]}</span>`})),(o,i)=>i===s.book,(o,i)=>{sel.book=i;sel.from=0;sel.to=0;done();});
    let anchor=null;
    Kit.seg($(".kw-unit",mount),b.units.map((u,i)=>({html:`${u.unit}<small>${Kit.esc(u.title||"")}</small>`})),(o,i)=>i>=s.from&&i<=s.to,(o,i)=>{
      /* click = one unit; shift-click (or click next to the current range) = a range */
      if(window.event&&window.event.shiftKey){sel.from=Math.min(s.from,i);sel.to=Math.max(s.to,i);}else{sel.from=i;sel.to=i;}done();});
    $$(".kw-unit button",mount).forEach((btn,i)=>{const u=b.units[i];btn.title=(u.topic||"")+(u.verified?"":" (not checked yet)");});
    const p=words.pick(s,opt),n=p.words.length;
    $(".kw-info",mount).innerHTML=`${n} words${opt.needEmoji?" with pictures":""}. Shift-click a second unit to mix several units.<span class="ja">${n}語${opt.needEmoji?"（絵あり）":""}。Shiftを押しながらクリックすると、複数のユニットを選べます。</span>`
      +(opt.minWords&&n<opt.minWords?`<span class="kit-err" style="display:block">${bi(["Not enough words here. Add another unit.","単語が足りません。ユニットを追加してください。"])}</span>`:"");
  }
  function done(){Object.assign(sel,cur());render();onChange&&onChange(sel);}
  render();return {render};
};
Kit.words=words;

/* ---------- keyboard shortcuts (projector games: Space = next, 1-4 = answer) ----------
   const off=Kit.keys({" ":next, "ArrowRight":next, "1":()=>pick(0)}, ()=>scr.current==="quiz")
   Ignored while typing in a box. The second argument decides when the keys are live. */
Kit.keys=function(map,when){
  const h=e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const t=e.target;if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable))return;
    if(when&&!when())return;const fn=map[e.key]||map[e.key.toLowerCase()];if(fn){e.preventDefault();fn(e);}};
  document.addEventListener("keydown",h);return ()=>document.removeEventListener("keydown",h);
};

/* ---------- fullscreen for the projector: Kit.fullscreen(button) ---------- */
Kit.fullscreen=function(btn){
  if(typeof btn==="string")btn=$(btn);if(!btn)return;
  const ok=!!(document.documentElement.requestFullscreen);if(!ok){btn.hidden=true;return;}
  btn.onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>Kit.toast(bi(["Fullscreen isn't allowed here","ここでは全画面にできません"])));}catch(e){}};
};

/* ---------- countdown ring ----------
   const C=Kit.countdown({mount, seconds:20, onEnd(){...}}); C.start(); C.pause(); C.reset(30); C.add(10)
   Ticks quietly in the last 5 seconds. Time's up is a sound and a word, never a flash. seconds:0 hides it. */
Kit.countdown=function(o){
  const m=typeof o.mount==="string"?$(o.mount):o.mount;m.classList.add("kit-count");
  m.innerHTML=`<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" class="kc-bg"/><circle cx="50" cy="50" r="44" class="kc-fg" pathLength="100"/></svg><b></b>`;
  let total=o.seconds||0,left=total,iv=0,last=-1;
  const fg=$(".kc-fg",m),num=$("b",m);
  const draw=()=>{const s=Math.ceil(left);num.textContent=s;fg.style.strokeDashoffset=String(total?100-100*left/total:0);m.classList.toggle("low",s<=5&&left>0);m.hidden=!total;};
  const api={
    start(){if(!total)return;clearInterval(iv);let t0=performance.now(),l0=left;iv=setInterval(()=>{left=Math.max(0,l0-(performance.now()-t0)/1000);const s=Math.ceil(left);
      if(s!==last&&s<=5&&s>0)sound.tone(880,0.06,"triangle",0.04);last=s;draw();if(left<=0){clearInterval(iv);iv=0;sound.play("nope");o.onEnd&&o.onEnd();}},100);},
    pause(){clearInterval(iv);iv=0;},
    reset(sec){api.pause();if(sec!=null)total=sec;left=total;last=-1;draw();},
    add(sec){left=Math.min(left+sec,total=Math.max(total,left+sec));draw();},

/* ---------- bingo ----------
   Kit.bingo.card(words, size, rng) -> size*size items (centre is FREE when size is odd)
   Kit.bingo.calls(words, rng) -> the calling order (same on every screen with the same rng seed)

   Seed the card with the student's number and the caller with the game number, so a card can be checked on the projector. */

  card(words,size,r){const n=size*size,mid=size%2?Math.floor(n/2):-1,pick=Kit.pickN(r,words,Math.min(words.length,n-(mid>=0?1:0)));

  calls(words,r){return Kit.shuffle(words.slice(),r);},

/* typing a mark: letters must follow one of the names on the board */
function typeMark(ch){
  const want=(SG.typed+ch).toLowerCase();
  const hit=ORDER.find(k=>namesOf(k).some(n=>n.toLowerCase().startsWith(want))&&k===SG.focus)||ORDER.find(k=>namesOf(k).some(n=>n.toLowerCase().startsWith(want)));
  if(!hit){if(SG.blots[0][SG.typed.length]==null)SG.blots[0][SG.typed.length]=Math.round(Math.random()*360);sfx("blot");renderBar();return;}
  SG.typed+=ch;SG.focus=hit;sfx("pen");
  if(namesOf(hit).some(n=>n.toLowerCase()===SG.typed.toLowerCase())){G.bossKey=hit;st.set("sel",hit);sfx("line");renderBar();openSheet();return;}
  renderBar();

document.addEventListener("keydown",e=>{
  if(scr.current!=="board"||e.ctrlKey||e.metaKey||e.altKey)return;
  if(FD.mode==="walk")return;   /* still walking up to the board: see the field code */
  if(!$("#ctlwrap").hidden){if(e.key==="Escape"||e.key==="Enter"){e.preventDefault();showControls(false);}return;}
  if(SG.step>2)return;
  const t=e.target;if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"))return;
  if(e.key==="Process"||e.isComposing){if(!SG.ime){SG.ime=true;SG.step?renderSign():renderBar();}return;}
  if(SG.ime){SG.ime=false;SG.step?renderSign():renderBar();}
  if(e.key==="Escape"&&SG.step>0){e.preventDefault();renderBoard();return;}
  if(SG.step===0){
    if(e.key==="Backspace"){e.preventDefault();if(SG.blots[0][SG.typed.length]!=null)delete SG.blots[0][SG.typed.length];else if(SG.typed){SG.typed=SG.typed.slice(0,-1);if(!SG.typed)SG.focus=null;}renderBar();return;}
    if(e.key.length!==1)return;e.preventDefault();if(e.repeat)return;
    if(!SG.typed&&e.key===" ")return;
    typeMark(e.key);return;}
  if(SG.step===1){
    if(e.key.length!==1)return;e.preventDefault();if(e.repeat)return;
    const line=SG.lines[1];
    if(e.key.toLowerCase()===line[SG.pos[1]].toLowerCase()){SG.pos[1]=skipMarks(line,SG.pos[1]+1);sfx("pen");if(SG.pos[1]>=line.length){SG.step=2;sfx("line");}}
    else{if(SG.blots[1][SG.pos[1]]==null)SG.blots[1][SG.pos[1]]=Math.round(Math.random()*360);sfx("blot");}
    renderSign();return;}
  /* step 2: the signature */
  if(e.key==="Enter"){e.preventDefault();if(/[A-Za-z]/.test(SG.name))sealContract();return;}
  if(e.key==="Backspace"){e.preventDefault();SG.name=SG.name.slice(0,-1);renderSign();return;}
  if(e.key.length===1){e.preventDefault();if(/[A-Za-z .'-]/.test(e.key)&&SG.name.length<14){SG.name+=e.key;sfx("pen");}renderSign();}
});

  if(on){veil(`<h2>Paused</h2><p class="ja">一時停止</p><div class="row"><button class="btn primary" id="vRes" type="button">Resume (Esc)<span class="ja">つづける</span></button><button class="btn" id="vCtl" type="button">Controls<span class="ja">そうさ</span></button><button class="btn" id="vBoard" type="button">Leave the hunt<span class="ja">契約ボードへ</span></button></div>`);
    $("#vRes").onclick=()=>pause(false);$("#vCtl").onclick=()=>showControls(true);$("#vBoard").onclick=()=>scr.show("board");G.veilEnter=()=>pause(false);}
  else veil(null);
}

/* ---------- main loop ---------- */
function tick(dt){
  if(G.paused)return;
  dt=Math.min(dt,0.05);
  G.clock=(G.clock||0)+dt;
  if(G.cut){cutTick(dt);return;}
  if(G.freeze>0){G.freeze-=dt;camera(dt,true);return;}
  /* slow motion during the critical strike */
  /* slow motion on the stab, and slower still on the rip */
  const ct=P.state==="crit"?P.t:-1,sdt=ct>0.88&&ct<1.3?dt*0.3:ct>0.28&&ct<0.4?dt*0.5:dt;
  if(G.running&&!G.over&&!G.final)G.time+=sdt;
  G.fdt=sdt;
  player(sdt);boss(sdt);updFx(sdt);camera(dt);hud();
}

const CRIT_KEYS=Object.keys(CRITS);
function pickCrit(){const k=CRIT_KEYS.filter(c=>c!==P.lastCrit);P.critK=P.lastCrit=k[Math.floor(Math.random()*k.length)];}
function toBoss(){const B=G.boss;const dx=B.x-P.x,dz=B.z-P.z;return {dx,dz,d:Math.hypot(dx,dz),a:Math.atan2(dx,dz)};}
/* one critical strike per stagger */
function canCrit(){const B=G.boss;if(!B||B.state!=="stagger"||B.critDone)return false;const t=toBoss();
  const fromBoss=Math.atan2(-t.dx,-t.dz);return t.d<3.4&&Math.abs(wrapA(fromBoss-B.a))<1.4;}
function begin(k){
  const A=ACT[k];P.state=k;P.t=0;P.hitDone=false;P.thrust=false;
  if(A&&A.cost){P.sta=Math.max(0,P.sta-A.cost);P.staT=0.55;}
  const t=G.boss&&G.boss.state!=="dead"?toBoss():null;
  if(k==="light"||k==="heavy"||k==="gun"||k==="crit"){
    const md=moveDir();
    if(t&&(t.d<8||k==="gun"||k==="crit"))P.a=t.a;else if(md)P.a=Math.atan2(md[0],md[1]);}
  if(k==="light")sfx("slash");
  if((k==="light"||k==="heavy")&&counterCheck())startCounter(A.hit[P.combo]??A.hit);
  /* drinking in front of Dimitri: from his guard he lunges (close) or shoots (far); idle and far, he shoots */
  if(k==="heal"&&G.boss&&G.boss.D.duel&&t&&G.running){const B=G.boss;
    if(B.state==="guard")bossStart("move",t.d<5.5?"thrust":"shot");
    else if(B.state==="idle"&&t.d>5)bossStart("move","shot");}
  if(k==="heavy")setTimeout(()=>sfx("heavy"),330);
  if(k==="dodge"){const md=moveDir();P.back=!md;const a=md?Math.atan2(md[0],md[1]):P.a+Math.PI;P.dA=a;if(md)P.a=a;P.iframe=0.3;sfx("dodge");}
  if(k==="gun")P.gunDur=A.miss;
  if(k==="heal"){P.m.vial.visible=true;}
  if(k==="crit"){const B=G.boss;B.critDone=true;pickCrit();P.iframe=A.dur+0.3;
    const fa=Math.atan2(P.x-B.x,P.z-B.z);P.tx=B.x+Math.sin(fa)*1.75;P.tz=B.z+Math.cos(fa)*1.75;
    /* the close-up camera goes on the side the camera is already on */
    const c=G.stage.camera,mx=(P.x+B.x)/2,mz=(P.z+B.z)/2,dx=B.x-P.x,dz=B.z-P.z;
    G.cside=((c.position.x-mx)*dz+(c.position.z-mz)*-dx)>=0?1:-1;}
}
function tryAction(){
  if(!buf)return;
  const k=buf.k,s=P.state,busy=s!=="move";
  if(k==="light"&&s==="light"&&P.t>=ACT.light.chain&&P.combo<2&&P.sta>0){P.combo++;buf=null;begin("light");return;}
  if(busy)return;
  /* the boss is down: E (or J) starts its finisher */
  if(G.boss&&G.boss.state==="final"&&(k==="crit"||k==="light")){buf=null;startFinisher();return;}
  if((k==="crit"||k==="light")&&canCrit()){buf=null;begin("crit");return;}
  if(k==="crit"){buf=null;return;}
  if(k==="heal"){buf=null;if(P.vials<=0){sfx("empty");ping("No vials left");return;}if(P.hp>=P.max){return;}begin("heal");return;}
  if(ACT[k]&&ACT[k].cost&&P.sta<=0)return;   /* wait for a little stamina; the press stays buffered */
  if(k==="light")P.combo=0;
  buf=null;begin(k);
}
function swingHits(A,dmg,kind){
  const B=G.boss;if(!B||B.state==="dead"||B.state==="intro"||B.state==="final")return false;
  if(B.y<-0.5)return false;   /* under the water */
  const t=toBoss();if(t.d-1.1>A.range)return false;
  if(Math.abs(wrapA(t.a-P.a))*180/Math.PI>A.arc/2+15)return false;
  damageBoss(dmg,P.x+t.dx*0.6,1.6,P.z+t.dz*0.6,kind);return true;
}
const HITSTOP={light:0.08,heavy:0.15,crit:0.24,gun:0.02},SHAKE={light:0.1,heavy:0.24,crit:0.32,gun:0};
function damageBoss(dmg,x,y,z,kind){
  const B=G.boss;if(B.state==="final")return;B.hp-=dmg;
  /* the blow lands: the boss jerks away from it (harder for a heavy), turned by the side the blade came from */
  if(kind!=="gun"&&B.state!=="stagger"){B.flinch=kind==="heavy"?0.3:0.2;B.fk=kind==="heavy"?1.8:1;B.fs=kind==="light"&&P.combo%2?-1:1;}
  if(kind==="heavy")G.punch=1;
  const big=kind==="crit";
  const back=Math.min(P.rally,dmg*(big?1.5:0.85));if(back>0){P.hp=Math.min(P.max,P.hp+back);P.rally-=back;}
  fx("mist",x,y,z,big?22:kind==="heavy"?16:9);fx("spark",x,y,z,big?8:kind==="heavy"?6:2);if(kind==="heavy")fx("ash",x,y-0.6,z,5);
  sfx(big?"crit":"hit");
  G.freeze=HITSTOP[kind];G.shake=Math.max(G.shake,SHAKE[kind]);
  const d=Math.hypot(x-P.x,z-P.z)||1;G.kx+=(x-P.x)/d*(big?0.5:0.25);G.kz+=(z-P.z)/d*(big?0.5:0.25);
  if(B.hp<=0)bossDown();
}
function player(dt){

  P.iframe=Math.max(0,P.iframe-dt);
  if(P.staT>0)P.staT-=dt;else if(P.state!=="dodge")P.sta=Math.min(100,P.sta+48*dt);
  if(P.rallyT>0)P.rallyT-=dt;else P.rally=Math.max(0,P.rally-14*dt);
  const T=H_REST();
  if(P.state==="dead"){P.t+=dt;const k=ease(Math.min(1,P.t*2));m.g.rotation.x=-1.45*k;m.g.position.y=0.12*k;
    T.rz=-0.9;T.lz=0.9;T.rx=-0.6;T.lx=-0.6;T.hd=-0.4;poseHunter(T,0.25);G.trail.update(false);return;}

        T.re=kf(t,[[0,-0.8],[0.13,-1.4],[0.25,0,"in"],[0.58,-0.3]]);
        T.twist=kf(t,[[0,0.3],[0.13,0.45],[0.25,-0.25,"in"],[0.58,0]]);

      }
      T.lean=kf(t,[[0,0.05],[0.09,-0.18],[0.21,0.5,"in"],[0.3,0.48],[0.44,0.12]]);
      T.by=kf(t,[[0.09,0.03],[0.21,-0.15],[0.3,-0.14],[0.44,-0.02]]);

const camFocus=new THREE.Vector3(0,0,2),camWant=new THREE.Vector3(),cineWant=new THREE.Vector3();
function camera(dt,frozen){
  const c=G.stage.camera,B=G.boss;
  let fx_=P.x,fz=P.z,back=1;
  if(B&&B.state!=="dead"){const d=Math.hypot(B.x-P.x,B.z-P.z);const k=d<14?0.4:0.15;fx_=lerp(P.x,B.x,k);fz=lerp(P.z,B.z,k);back=1+clamp((d-4)/14,0,0.55);}
  if(!frozen){camFocus.x=lerp(camFocus.x,fx_,Math.min(1,dt*5));camFocus.z=lerp(camFocus.z,fz,Math.min(1,dt*5));}
  camWant.set(camFocus.x,10*back,camFocus.z+6.2*back);
  const cineOn=P.state==="crit";
  const push=P.state==="crit"&&P.t>0.75&&P.t<1.45?1:0;G.cz=(G.cz||0)+(push-(G.cz||0))*Math.min(1,dt*4);
  G.punch=Math.max(0,(G.punch||0)-dt*4);   /* a heavy hit nudges the camera in */
  const fov=50-9*G.cz-4*Math.sin(Math.min(1,G.punch)*Math.PI/2);
  if(Math.abs(c.fov-fov)>0.05){c.fov=fov;c.updateProjectionMatrix();}
  G.cw+=((cineOn?1:0)-G.cw)*Math.min(1,dt*(cineOn?7:2.2));
  let lx=camFocus.x,ly=1,lz=camFocus.z;
  if(G.cw>0.01&&B){const mx=(P.x+B.x)/2,mz=(P.z+B.z)/2;let dx=B.x-P.x,dz=B.z-P.z;const d=Math.hypot(dx,dz)||1;dx/=d;dz/=d;const s=G.cside||1;
    const cd=4.6-1.1*G.cz;cineWant.set(mx+dz*s*cd-dx*2.4,2.3-0.5*G.cz,mz-dx*s*cd-dz*2.4);
    camWant.lerp(cineWant,G.cw);lx=lerp(lx,mx,G.cw);ly=lerp(1,1.7,G.cw);lz=lerp(lz,mz,G.cw);}
  if(!frozen)c.position.lerp(camWant,Math.min(1,dt*(G.cw>0.01?8:4)));
  G.shake=Math.max(0,G.shake-dt*0.9);G.kx*=0.82;G.kz*=0.82;
  const s=G.shake;c.position.x+=(Math.random()-0.5)*s+G.kx*0.3;c.position.y+=(Math.random()-0.5)*s;c.position.z+=G.kz*0.3;
  c.lookAt(lx,ly,lz);
}

function clue(){const c=BOSSES[G.bossKey].notice.clues;const i=P.stats.parries===0?0:G.boss.phase>1?2:1;return `Tip: ${c[i][0]}<span class="ja">${c[i][1]}</span>`;}
/* at 0 health the boss does not die yet: it drops to its knees and waits for the finisher */

  B.hp=0;B.state="final";B.t=0;B.y=0;B.move=null;B.ring=null;if(G.ringMesh)G.ringMesh.visible=false;showMark(0,0,false);
  setGlow(null);G.btR.clear();G.btL.clear();B.m.g.visible=true;if(B.m.shield){B.m.shield.visible=false;B.m.um.visible=true;}

/* the finisher is a cutscene (boss.finale); it ends on black, then the results */
function startFinisher(){
  const B=G.boss,F=B.D.finale;G.over=true;B.state="finale";held.clear();buf=null;P.state="move";P.m.vial.visible=false;
  /* its own copies of the materials (colors are shared through M), so it can fade or turn to stone alone */
  const mats=[];B.m.g.traverse(o=>{if(o.material&&o.material!==B.m.shadowMat){o.material=o.material.clone();mats.push(o.material);}});
  B.fade=mats;B.col0=mats.map(x=>x.color.clone());B.em0=mats.map(x=>x.emissive?x.emissive.clone():null);
  G.cut={t:0,I:{dur:F.dur,glide:0,final:true,run:F.run},fired:{}};
  if(F.start)F.start(B);
  prompt(`<kbd>Space</kbd> Skip<span class="ja">スペースでスキップ</span>`);
}
function finishEnd(){
  G.cut=null;G.running=false;G.boss.state="done";$("#fade").style.opacity=1;prompt(null);showResult();
}
/* place the hunter by hand during a finale */
function huntAt(T,k){P.m.g.position.set(P.x,0,P.z);P.m.g.rotation.y=P.a;poseHunter(T,k);}
function walkAway(t,from,dt){   /* turn around, then walk off slowly; returns true while walking */
  if(t<from)return false;const HT=H_REST();
  P.a=lerp(Math.PI,0,ease(Math.min(1,(t-from)/0.6)));
  const w=t>from+0.5;if(w){P.z+=1.5*dt;}walkPose(HT,w?1:0,w?dt*0.75:dt);HT.lean=0.08;
  if(w&&Math.floor(P.walk/Math.PI)!==Math.floor((P.walk-dt*8.25)/Math.PI))sfx("foot");
  huntAt(HT,0.3);return true;}

/* Bell Warden, "Silence": the sword goes into the bell; it grabs the blade and pushes back;

function wardenFinale(t,dt){
  const B=G.boss,m=B.m,shk=t>1.3&&t<3.3?Math.sin(G.clock*38)*0.035:0;

  if(!walkAway(t,6.9,dt)){const HT=H_REST();
    HT.rx=kf(t,[[0,-0.1],[0.7,0.9],[0.9,-1.45,"in"],[1.3,-1.4],[3.0,-1.15],[3.25,-1.0],[3.6,-1.6,"in"],[6.2,-1.5],[6.45,-0.6,"in"],[6.9,-0.1]])+shk;
    HT.wr=kf(t,[[0,0.5],[0.7,0.2],[0.9,1.5,"in"],[6.2,1.5],[6.9,0.5]]);
    HT.re=kf(t,[[0,-0.35],[0.7,-1.3],[0.9,-0.05,"in"],[3.0,-0.5],[3.25,-0.7],[3.6,0,"in"],[6.2,-0.2],[6.9,-0.35]]);
    HT.twist=kf(t,[[0,0],[0.7,-0.5],[0.9,0.55,"in"],[1.3,0.45],[3.0,0.2],[3.6,0.1],[6.2,0.1],[6.6,0]]);
    HT.lean=kf(t,[[0,0],[0.7,-0.25],[0.9,0.5,"in"],[1.3,0.3],[3.0,-0.15],[3.25,-0.2],[3.6,0.7,"in"],[6.2,0.6],[6.6,0.05]])+shk;
    HT.by=kf(t,[[0,0],[0.7,-0.1],[0.9,-0.32],[3.0,-0.2],[3.6,-0.38],[6.2,-0.34],[6.6,0]]);HT.hl=kf(t,[[0.7,0],[0.9,-0.55],[3.0,-0.3],[3.6,-0.75],[6.2,-0.7],[6.6,0]]);
    HT.hr=kf(t,[[1.3,0],[2.0,0.35],[3.0,0.4],[3.6,0.3],[6.6,0]]);
    /* the left hand joins the right on the handle for the second drive */
    HT.lx=kf(t,[[0,0.1],[0.9,-0.6],[3.0,-0.6],[3.3,-1.45],[6.2,-1.45],[6.6,0.1]]);HT.lz=kf(t,[[3.0,0],[3.3,-0.35],[6.2,-0.35],[6.6,0]]);HT.le=kf(t,[[3.0,-0.25],[3.3,-0.1],[6.2,-0.1],[6.6,-0.25]]);
    HT.hd=kf(t,[[0.9,0.25],[1.3,0.1],[3.0,-0.1],[3.6,0.3],[6.2,0.3],[6.6,0]]);HT.coat=kf(t,[[3.3,0],[3.6,-0.4],[4.2,0]]);
    huntAt(HT,t<0.05?1:0.45);}
  const bellAt=()=>{const v=new THREE.Vector3();m.bellG.children[1].getWorldPosition(v);return v;};
  if(t>=0.9)once("stab",()=>{const v=bellAt();tone(150,0.7,"sine",0.08,90);noise(0.2,0.08);fx("spark",v.x,v.y,v.z,8);fx("ash",v.x,v.y,v.z,8);G.shake=0.14;});
  if(t>=1.3)once("grab",()=>{sfx("roar");G.shake=0.12;tone(98,1.8,"sine",0.05,80);});
  if(t>=2.2)once("ring",()=>{tone(196,0.9,"sine",0.04,186);});   /* a choked half-ring from the bell */
  if(t>=3.6)once("drive",()=>{const v=bellAt();sfx("crit");fx("ash",v.x,v.y,v.z,14);fx("spark",v.x,v.y,v.z,10);shock(B.x,B.z,2.6,0x4a5a6a);G.shake=0.3;});
  if(t>=6.2)once("pull",()=>{sfx("slash");const v=bellAt();fx("ash",v.x,v.y,v.z,6);});
  /* kneeling up, then lunging at the hunter, grabbing at the blade, then thrown down by the drive and sinking into the crouch */
  const T=bossRest(),j=t>0.9&&t<1.3?Math.sin((t-0.9)/0.4*Math.PI):0,j2=t>3.6&&t<4.0?Math.sin((t-3.6)/0.4*Math.PI):0;
  T.chest=kf(t,[[0,0.35],[0.9,0.35],[1.3,0.2],[1.6,0.05,"in"],[3.0,0.1],[3.6,0.15],[4.2,0.5],[5.2,1.35]])-0.35*j-0.4*j2+shk;
  T.by=kf(t,[[0,-0.95],[1.3,-0.95],[1.6,-0.7],[3.0,-0.72],[3.6,-0.8],[5.2,-0.95]])+0.15*j+0.15*j2;
  T.head=kf(t,[[0,-0.25],[0.9,-0.3],[1.6,-0.5],[3.0,-0.45],[3.6,-0.4],[4.2,0],[5.2,0.9]])-0.6*j-0.7*j2;
  bothArms(T,kf(t,[[0,-0.15],[1.3,-0.3],[1.6,-0.8,"in"],[3.0,-0.75],[3.6,-0.8],[4.0,-0.3],[5.2,-0.05]])+shk,
    kf(t,[[0,0.25],[1.3,0.6],[1.6,0.2],[3.0,0.25],[3.6,0.3],[4.0,0.8],[5.2,0.25]]),kf(t,[[1.3,-0.1],[1.6,-0.55],[3.0,-0.65],[3.6,-0.55],[4.2,-0.2],[5.2,-0.1]]));
  m.bellG.rotation.x=t<0.9?-0.45+Math.sin(t*2.2)*0.12:lerp(m.bellG.rotation.x,-0.45+(t>2.2&&t<3.0?Math.sin(t*9)*0.08:0),0.1);

  const k=ease(clamp((t-6.9)/5.3,0,1));
  return {pos:[lerp(-1.6,-1.2,k),lerp(2.0,2.6,k),lerp(-7.2,-6.6,k)],look:[0,1.1,lerp(-1,P.z,0.7)],fov:44,fade};
}

/* Dimitri, "Quick draw": both draw; he knocks the first shot aside with the umbrella and lunges;
   the hunter fires again, point blank. He tips his hat and is gone. */
function dimitriFinale(t,dt){
  const B=G.boss,m=B.m;
  if(!walkAway(t,6.6,dt)){const HT=H_REST(),aim=kf(t,[[1.5,0.1],[1.65,-1.6,"in"],[1.85,-1.6],[1.9,-2.2,"in"],[2.1,-1.6],[2.4,-1.3],[2.55,-1.55,"in"],[2.62,-2.1,"in"],[2.85,-1.55],[5.4,-1.55],[6.0,0.1]]);
    HT.lx=aim;HT.le=kf(t,[[2.1,-0.05],[2.4,-0.5],[2.55,-0.6],[2.62,-0.1],[5.4,-0.05]]);
    HT.twist=kf(t,[[1.5,0],[1.65,-0.45],[2.3,-0.4],[2.55,-0.9,"in"],[2.9,-0.75],[5.4,-0.4],[6.0,0]]);
    HT.lean=kf(t,[[2.3,0.05],[2.55,-0.3,"in"],[2.9,-0.2],[3.6,0.05]]);HT.by=kf(t,[[2.3,0],[2.55,-0.18],[3.2,-0.1],[3.8,0]]);
    HT.rx=kf(t,[[1.5,-0.1],[1.65,0.3],[5.4,0.3],[6.0,-0.1]]);HT.coat=kf(t,[[1.5,0],[1.65,-0.3],[2.2,0],[2.55,-0.45],[3.0,0]]);
    HT.hl=kf(t,[[2.3,0],[2.55,0.4],[3.2,0.3],[3.8,0]]);HT.hr=kf(t,[[2.3,0],[2.55,-0.5],[3.2,-0.4],[3.8,0]]);
    HT.hd=kf(t,[[5.4,0],[6.0,0.25],[6.4,0.15]]);
    /* side-step out of the lunge */
    if(t>2.4&&t<2.6)P.x+=2.2*dt;
    huntAt(HT,t<0.05?1:0.6);}
  const v=new THREE.Vector3();
  if(t>=1.9)once("shot1",()=>{P.m.muzzle.getWorldPosition(v);sfx("gun");fx("smoke",v.x,v.y,v.z,6);});
  if(t>=1.95)once("deflect",()=>{m.armR.tip.getWorldPosition(v);sfx("deflect");fx("spark",v.x,v.y,v.z,10);});
  if(t>=2.62)once("shot2",()=>{P.m.muzzle.getWorldPosition(v);sfx("gun");noise(0.3,0.12);fx("smoke",v.x,v.y,v.z,8);
    fx("spark",B.x,1.8,B.z,6);fx("mist",B.x,1.8,B.z,4);G.shake=0.18;m.um.visible=false;G.umb.visible=true;});
  if(t>=2.95)once("clatter",()=>{tone(700,0.15,"triangle",0.02,500);noise(0.12,0.05);});
  /* he rises, draws, flicks the umbrella across the bullet, and lunges; the second shot stops him dead */
  if(t>2.05&&t<2.6)B.z+=5.6*dt;
  const T=bossRest(),j=t>2.62&&t<3.2?Math.sin((t-2.62)/0.58*Math.PI):0;
  const th={...T};thrustAnim(clamp(t-1.95,0,1.0),th,{hits:[{t:0.62}]});   /* the lunge reuses his thrust */
  const lunging=t>1.95&&t<2.75;
  T.chest=(lunging?th.chest:kf(t,[[0,1.3],[0.8,0.45],[1.95,0.45],[2.75,0.95],[3.3,0.6],[4.4,0.6],[5.6,1.25]]))-0.45*j;
  T.by=(lunging?th.by:kf(t,[[0,-0.95],[0.8,0],[2.75,-0.4],[3.3,0],[4.4,0],[5.6,-0.95]]))+0.1*j;
  T.head=kf(t,[[0,0.6],[0.8,0],[2.6,0.1],[3.5,0.1],[3.8,0.3],[4.2,0.1],[5.6,0.6]])-0.6*j;
  T.rx=kf(t,[[1.7,-0.3],[1.85,-1.6,"in"],[1.95,-1.9],[2.05,-0.6]]);T.re=-0.25;T.rz=kf(t,[[1.7,-0.2],[1.95,0.4],[2.05,-0.1]]);
  if(lunging&&t>2.05){T.rx=th.rx;T.re=th.re;T.twist=th.twist;}
  if(t>2.75)T.rx=kf(t,[[2.75,-1.2],[3.2,-0.1]]);
  T.lx=kf(t,[[0.8,-0.1],[1.6,-0.1],[1.8,-1.4,"in"],[1.95,-1.5],[2.3,-0.3],[3.4,-0.3],[3.7,-2.6],[4.1,-2.6],[4.4,-0.2]]);
  T.le=kf(t,[[1.8,-0.05],[2.3,-0.3],[3.7,-1.7],[4.1,-1.7],[4.4,-0.3]]);T.lz=0.3;
  if(t>=3.7)once("tip",()=>sfx("tip"));
  const q=clamp((t-4.5)/1.1,0,1);if(q>0){B.fade.forEach(x=>{x.transparent=true;x.opacity=1-q;});
    if(Math.random()<0.12&&q<1)fx("mist",B.x+(Math.random()-0.5)*0.8,0.6+Math.random()*1.8,B.z+0.5+Math.random()*0.5,1);}
  if(q>=1)m.g.visible=false;
  if(t>=5.0&&G.rain)G.rain.frozen=false;
  m.g.position.set(B.x,0,B.z);m.g.rotation.y=B.a;poseBoss(T,t<0.05?1:0.5);
  if(t>=8.0)once("gone",()=>{sfx("win");banner("The hunt is over",B.D.gone,false,0);});
  const fade=clamp((t-10.4)/1.2,0,1);
  /* a wide, tilted standoff; after the second shot, straight behind him, so he hides the hunter until he is gone */
  if(t<2.62)return {pos:[lerp(6.6,5.6,t/2.62),1.4,-1.0],look:[0,1.7,-1.0],fov:48,roll:0.12,fade};
  const k=ease(clamp((t-5.6)/6,0,1));
  return {pos:[0.15,lerp(1.95,2.2,k),lerp(B.z-3.4,B.z-2.8,k)],look:[0,lerp(1.9,1.2,k),lerp(B.z+2,P.z,k)],fov:lerp(38,44,k),fade};
}

function showResult(){
  const D=BOSSES[G.bossKey],s=P.stats,time=G.time;
  const score=Math.max(100,Math.round(1000-s.hits*60-Math.max(0,time-D.par)*3+s.parries*20+s.perfects*20));
  const rank=score>=950?"S":score>=800?"A":score>=600?"B":"C";
  const title={S:["Master hunter","名人ハンター"],A:["Great hunter","すごいハンター"],B:["Brave hunter","勇かんなハンター"],C:["New hunter","新人ハンター"]}[rank];
  const notes=[];
  if(s.hits===0)notes.push(["No damage!","ノーダメージ！"]);
  if(s.vialsUsed===0)notes.push(["You used no vials.","回復を使わなかった。"]);
  if(s.perfects)notes.push(["Perfect parries: "+s.perfects,"パーフェクトパリィ"+s.perfects+"回"]);
  if(s.parries>=3)notes.push(["Sharp eyes: "+s.parries+" parries!","パリィ"+s.parries+"回！"]);
  if(time<D.par*0.7)notes.push(["A fast hunt!","スピード狩り！"]);
  const name=st.get("name","")||"Hunter";
  const old=st.get("best_"+G.bossKey,null);
  if(!diff&&(!old||score>old.score))st.set("best_"+G.bossKey,{rank,score});
  $("#result").innerHTML=`<div class="result">
    <h2>Contract complete</h2><p class="ja">契約完了</p>
    <div class="rank">${rank}<small><span class="sig">${name.replace(/[<>&"]/g,"")}</span>, ${title[0].toLowerCase()}</small></div><p class="ja">${title[1]}</p>
    <div class="stats"><span>Time</span><b>${Kit.fmtTime(time)}</b><span>Hits taken</span><b>${s.hits}</b><span>Parries</span><b>${s.parries}</b><span>Critical strikes</span><b>${s.crits}</b><span>Vials used</span><b>${s.vialsUsed} / 5</b><span>Score</span><b>${score}</b></div>
    ${notes.length?`<ul class="notes">${notes.map(n=>`<li>${n[0]}<span class="ja">${n[1]}</span></li>`).join("")}</ul>`:""}
    <p class="journal">Journal: ${D.journal[0]}<span class="ja">${D.journal[1]}</span></p>
    <div class="go"><button class="btn primary" id="rAgain" type="button">Hunt again<span class="ja">もう一度</span></button><button class="btn" id="rBoard" type="button">Contract board<span class="ja">契約ボード</span></button></div></div>`;
  $("#rAgain").onclick=startHunt;$("#rBoard").onclick=()=>scr.show("board");
  scr.show("result");
}

/* ---------- the field: title screen, the walk up to the notice board, and the board's surroundings ----------
   One small 3D scene behind the title and the board. The title looks at the board from far down the path;
   any key walks up to it in first person (the long walk once per session, a short one after each hunt),
   then the camera stops exactly where the HTML board lines up with the 3D one, so the field frames it.
   Small random things happen around it: crows, a far figure, fog, clouds over the moon, rain. Nothing flashes. */
const FD={st:null,loop:null,mode:"off",t:0,walk:null,skip:false,ev:[],next:6,rainK:0,rainWant:0,fogK:0,fogWant:0,cloudX:-60};
const BW=4.2;   /* board width in the scene; its height follows the HTML board */
function fieldReady(){

  st.hemi.intensity=0.5;st.hemi.color.setHex(0x9aa6d8);st.hemi.groundColor.setHex(0x2a2620);st.sun.intensity=0.4;st.sun.color.setHex(0xaab4e0);st.sun.position.set(-6,10,-8);
  st.camera.far=420;st.camera.updateProjectionMatrix();   /* the sky and hills sit far away */
  buildField(st.scene);layoutBoard();
  window.addEventListener("resize",()=>{if(FD.mode==="menu")layoutBoard();});
  window.addEventListener("scroll",()=>{if(FD.mode==="menu")layoutBoard();},{passive:true});
  return true;}
function buildField(scene){
  const F=FD.f={};
