  gt.repeat.set(40,40);
  const gg=new THREE.PlaneGeometry(220,220,44,44),gp=gg.attributes.position;
  for(let i=0;i<gp.count;i++){const x=gp.getX(i),y=gp.getY(i),far=clamp((Math.abs(x)-4)/30,0,1)+clamp((-y-20)/60,0,1);
    gp.setZ(i,(Math.sin(x*0.13)*Math.cos(y*0.09)*2.2+Math.sin(x*0.05+y*0.04)*3)*far*1.4);}
  gg.computeVertexNormals();
  const ground=new THREE.Mesh(gg,Kit3D.mat(0xffffff,{map:gt}));ground.rotation.x=-Math.PI/2;scene.add(ground);
  /* the mud path up to the board */
  const pth=new THREE.Mesh(new THREE.PlaneGeometry(1.8,44),Kit3D.mat(0x2b241d));pth.rotation.x=-Math.PI/2;pth.position.set(0,0.02,22);scene.add(pth);
  /* the notice board: two posts, a plank face, a frame, a little roof, a lantern on a hook */
  const b=F.board=grp(0,0,0,scene);
  F.posts=[-1,1].map(s=>box(0.2,1,0.2,0x2a1d14,s*(BW/2+0.05),0.5,0,b));
  F.face=box(BW,1,0.12,0x3e2c1e,0,0,0,b);
  F.frame=[box(BW+0.34,0.16,0.2,0x24170e,0,0,0.02,b),box(BW+0.34,0.16,0.2,0x24170e,0,0,0.02,b),box(0.16,1,0.2,0x24170e,0,0,0.02,b),box(0.16,1,0.2,0x24170e,0,0,0.02,b)];
  F.roof=grp(0,0,0,b);[-1,1].forEach(s=>{const r=box(BW/2+0.45,0.08,0.8,0x1e1813,s*(BW/4+0.2),0.22,0.1,F.roof);r.rotation.z=-s*0.32;});
  /* papers on the face, seen while walking up (the HTML posters cover them at the end) */
  F.papers=grp(0,0,0.1,b);   /* well clear of the planks: the low-res vertex snap would push them in */[[-1.3,0.25,0.85,1.1,-0.06],[0,0.18,0.95,1.25,0.04],[1.3,0.3,0.8,1.0,0.08],[-0.75,-0.72,0.5,0.42,0.1],[0.95,-0.68,0.55,0.38,-0.1]].forEach(([x,y,w,h,r],i)=>{
    const m=box(w,h,0.01,0xcdb88a,x,y,i*0.02,F.papers);m.rotation.z=r;});   /* each sheet a little in front of the last, so overlaps never flicker */
  const lan=F.lantern=grp(BW/2+0.05,0,0.35,b);box(0.04,0.3,0.04,0x15110d,0,0.15,-0.1,lan);
  F.lanGlass=box(0.2,0.28,0.2,Kit3D.mat(0xffc670,{emissive:0x8a5a1a}),0,-0.1,0,lan);box(0.24,0.05,0.24,0x15110d,0,0.06,0,lan);
  F.lamp=new THREE.PointLight(0xffb060,1.1,9);F.lamp.position.set(0,-0.1,0.2);lan.add(F.lamp);
  /* broken fence along the path, dead trees, far hills, a spire, the moon and stars */
  for(let z=3;z<34;z+=2.6){[-1,1].forEach(s=>{if(Math.sin(z*7+s)>0.75)return;const p=box(0.12,0.9+Math.sin(z*3)*0.2,0.12,0x2a221a,s*2.2,0.45,z,scene);p.rotation.z=Math.sin(z*5+s)*0.12;
    if(Math.sin(z*11+s)>-0.2)box(0.06,0.08,2.4,0x2a221a,s*2.2,0.65,z+1.3,scene).rotation.x=Math.sin(z)*0.1;});}
  const tree=(x,z,h,r)=>{const t=grp(x,0,z,scene);t.rotation.y=r;limb(0.12,0.2,h,0x17141a,0,0,0,t).rotation.x=Math.PI;
    [[0.7,0.5,-0.8],[0.55,-0.6,0.9],[0.8,0.3,0.6]].forEach(([y,a,c],i)=>{const br=grp(0,h*y,0,t);br.rotation.set(0,i*2.1,a);limb(0.03,0.08,h*0.45,0x17141a,0,0,0,br).rotation.x=Math.PI+c*0.3;});};
  [[-7,-4,4.6,0.3],[9,-9,5.4,1],[-14,-18,6,2],[16,-22,5,0.5],[-5,14,3.8,1.4],[7.5,9,4.2,2.4],[-20,-35,7,0],[22,-40,6,1]].forEach(a=>tree(...a));
  [[-60,-90,30,16],[10,-110,40,22],[70,-95,32,14],[-110,-60,40,18]].forEach(([x,z,r,h])=>{const c=cone(r,h,6,0x151826,x,h/2-2,z,scene);});
  const sp=grp(26,0,-78,scene);box(4,14,4,0x14161f,0,7,0,sp);cone(3,12,4,0x10121a,0,20,0,sp).rotation.y=Math.PI/4;
  const moon=F.moon=new THREE.Mesh(new THREE.CircleGeometry(7,20),Kit3D.basic(0xe8e4cf));moon.material.fog=false;moon.position.set(-80,24,-120);scene.add(moon);
  /* a faint glow along the horizon, so the hills and trees stand out against the sky */
  const hc=document.createElement("canvas");hc.width=2;hc.height=64;const hx=hc.getContext("2d"),hg=hx.createLinearGradient(0,0,0,64);
  hg.addColorStop(0,"#0f1222");hg.addColorStop(0.62,"#1e2440");hg.addColorStop(0.8,"#2c2f48");hg.addColorStop(1,"#1a1d2c");hx.fillStyle=hg;hx.fillRect(0,0,2,64);
  const sky=new THREE.Mesh(new THREE.PlaneGeometry(900,190,32,8),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(hc),fog:false,depthWrite:false}));sky.position.set(0,55,-190);scene.add(sky);
  const sg=new THREE.BufferGeometry(),sv=[];for(let i=0;i<260;i++){const a=Math.random()*TAU,e=0.15+Math.random()*1.2;sv.push(Math.cos(a)*150*Math.cos(e),15+Math.sin(e)*120,Math.sin(a)*150*Math.cos(e)-20);}
  sg.setAttribute("position",new THREE.Float32BufferAttribute(sv,3));const stars=new THREE.Points(sg,new THREE.PointsMaterial({color:0xbfc4d8,size:1,sizeAttenuation:false,fog:false}));scene.add(stars);
  /* clouds that drift across the moon */
  F.clouds=[0,1,2].map(i=>{const c=new THREE.Mesh(new THREE.PlaneGeometry(26,7),Kit3D.basic(0x1a1d2c,{transparent:true}));c.material.opacity=0.92;c.material.fog=false;
    c.position.set(-200,24+i*3,-118+i);scene.add(c);return c;});
  /* low fog banks that roll across the field */
  F.fogs=[0,1,2,3].map(i=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(30,3),Kit3D.basic(0x5a6378,{transparent:true}));m.material.opacity=0;m.material.depthWrite=false;m.material.side=THREE.DoubleSide;
    m.position.set(-40,0.9,-6+i*7);scene.add(m);return m;});
  /* rain */
  const N=380,pos=new Float32Array(N*6),geo=new THREE.BufferGeometry();geo.setAttribute("position",new THREE.BufferAttribute(pos,3));
  F.drops=[];for(let i=0;i<N;i++)F.drops.push({x:(Math.random()-0.5)*30,y:Math.random()*14,z:Math.random()*40-10,v:15+Math.random()*6});
  F.rain=new THREE.LineSegments(geo,new THREE.LineBasicMaterial({color:0x8a98b4,transparent:true,opacity:0}));F.rain.frustumCulled=false;F.rain.visible=false;scene.add(F.rain);F.rainPos=pos;
  /* a crow, and a far-off figure */
  const cr=F.crow=grp(0,0,0,scene);cr.visible=false;
  box(0.16,0.14,0.32,0x0d0c10,0,0.12,0,cr);box(0.11,0.11,0.12,0x0d0c10,0,0.2,0.18,cr);cone(0.03,0.1,4,0x2a2622,0,0.2,0.27,cr).rotation.x=Math.PI/2;
  box(0.1,0.03,0.2,0x0d0c10,0,0.1,-0.22,cr);
  F.wings=[-1,1].map(s=>{const w=grp(s*0.08,0.16,0,cr);box(0.32,0.02,0.2,0x0d0c10,s*0.16,0,0,w);return w;});
  F.legs=[box(0.015,0.08,0.015,0x2a2622,-0.04,0.03,0,cr),box(0.015,0.08,0.015,0x2a2622,0.04,0.03,0,cr)];
  const fg=F.fig=grp(-40,0,-34,scene);fg.visible=false;
  limb(0.16,0.3,1.3,0x0b0b10,0,1.5,0,fg);limb(0.12,0.1,0.25,0x0b0b10,0,1.75,0,fg);cyl(0.38,0.38,0.03,8,0x0b0b10,0,1.78,0,fg);cyl(0.13,0.14,0.3,8,0x0b0b10,0,1.95,0,fg);
  limb(0.05,0.04,1.25,0x0b0b10,0.3,1.4,0,fg).rotation.z=0.15;
}
/* the board's height follows the HTML board, so its frame sits just around it */
function layoutBoard(){
  const F=FD.f;if(!F)return;const wall=$("#wall");let BH=2.6,cam=null;
  if(wall&&!$("#board").hidden){const r=wall.getBoundingClientRect(),W=innerWidth,H=innerHeight;
    if(r.width>50){const wpp=BW/r.width;BH=r.height*wpp;
      const c=FD.st.camera,d=wpp*H/(2*Math.tan(c.fov*Math.PI/360));
      const cy=0.7+BH/2;cam={pos:[-(r.left+r.width/2-W/2)*wpp,cy+(r.top+r.height/2-H/2)*wpp,d],look:null};cam.look=[cam.pos[0],cam.pos[1],0];}}
  const bot=0.7,top=bot+BH;
  F.face.scale.y=BH;F.face.position.y=bot+BH/2;F.papers.position.y=bot+BH/2;F.papers.scale.set(1,Math.min(1.3,BH/2.6),1);   /* only taller, never wider than the board */
  F.frame[0].position.y=top+0.08;F.frame[1].position.y=bot-0.08;[2,3].forEach((i,j)=>{const f=F.frame[i];f.scale.y=BH+0.32;f.position.set((j?1:-1)*(BW/2+0.09),bot+BH/2,0.02);});
  F.posts.forEach(p=>{p.scale.y=top+0.5;p.position.y=(top+0.5)/2;});F.roof.position.y=top+0.25;F.lantern.position.y=top-0.25;
  FD.menuCam=cam||{pos:[0,bot+BH/2,6.2],look:[0,bot+BH/2,0]};
  if(FD.mode==="menu")setFieldCam(FD.menuCam.pos,FD.menuCam.look);
}
function setFieldCam(pos,look){const c=FD.st.camera;c.position.set(pos[0],pos[1],pos[2]);c.lookAt(look[0],look[1],look[2]);}
/* which screen shows the field, and what it does on arrival */
function fieldShow(id,prev){
  if(id==="title"||id==="board"||id==="result")music("field");
  const on=id==="title"||id==="board";
  $("#field").hidden=!on;document.body.classList.toggle("infield",on);
  if(!on){if(FD.loop){FD.loop.stop();FD.loop=null;}FD.mode="off";document.body.classList.remove("walking");return;}
  if(!fieldReady()){document.body.classList.remove("walking");return;}
  if(!FD.loop)FD.loop=Kit3D.loop(FD.st,fieldTick);
  if(id==="title"){FD.mode="title";FD.t=0;$("#title").classList.remove("out");document.body.classList.add("walking");return;}
  /* the board: walk up to it */
  const first=!sessionStorage.getItem("hc_walked");let from=null;
  if(prev==="title")from=first?[0.25,1.65,30]:null;
  else if(prev==="play"||prev==="result")from=[-0.2,1.65,12];
  requestAnimationFrame(()=>{layoutBoard();
    if(!from){FD.mode="menu";setFieldCam(FD.menuCam.pos,FD.menuCam.look);document.body.classList.remove("walking");return;}
    try{sessionStorage.setItem("hc_walked","1");}catch(e){}
    FD.mode="walk";FD.skip=false;FD.walk={from,t:0,dur:from[2]>20?6.5:2.8,step:0};document.body.classList.add("walking");});
}
function fieldTick(dt){
  const F=FD.f,c=FD.st.camera,clock=(FD.clock=(FD.clock||0)+dt);FD.t+=dt;
  if(FD.mode==="title"){const s=Math.sin(clock*0.15);setFieldCam([4.5+s*1.2,2.3+Math.sin(clock*0.11)*0.2,34],[0,1.7,0]);}
  else if(FD.mode==="walk"){const W=FD.walk;W.t+=dt;if(FD.skip)W.t=W.dur;const M=FD.menuCam;
    const k=Math.min(1,W.t/W.dur),e=ease(k),walkK=Math.min(1,W.t/(W.dur-0.9));
    const z=lerp(W.from[2],M.pos[2],1-Math.pow(1-walkK,1.6)),ph=W.t*7.2,bob=(1-e)*Math.abs(Math.sin(ph))*0.06;
    if(Math.floor(ph/Math.PI)!==W.step&&walkK<1){W.step=Math.floor(ph/Math.PI);sfx("foot");}
    const x=lerp(W.from[0],M.pos[0],e),y=lerp(W.from[1],M.pos[1],e)+bob;
    setFieldCam([x+Math.sin(ph*0.5)*0.03*(1-e),y,z],[lerp(0,M.look[0],e),lerp(1.6,M.look[1],e),0]);
    if(k>=1){FD.mode="menu";layoutBoard();document.body.classList.remove("walking");}}
  /* the lantern breathes, and now and then dips low and recovers (slowly; never a flash) */
  FD.dip=Math.max(0,(FD.dip||0)-dt*0.8);if(Math.random()<dt*0.05)FD.dip=1;
  const fl=0.85+Math.sin(clock*2.3)*0.07+Math.sin(clock*5.1)*0.04-Math.sin(Math.min(1,FD.dip)*Math.PI)*0.4;
  F.lamp.intensity=1.1*fl;F.lanGlass.material.emissive.setRGB(0.54*fl,0.35*fl,0.1*fl);
  F.lantern.rotation.z=Math.sin(clock*1.3)*0.06;
  /* random happenings */
  FD.next-=dt;if(FD.next<=0){FD.next=9+Math.random()*12;const pick=["crow","figure","fog","cloud","rain"].filter(k=>!FD.ev.some(e=>e.k===k));
    if(pick.length)startFieldEvent(pick[Math.floor(Math.random()*pick.length)]);}
  FD.ev=FD.ev.filter(e=>fieldEvent(e,dt));
  FD.rainK+=(FD.rainWant-FD.rainK)*Math.min(1,dt*0.35);F.rain.visible=FD.rainK>0.02;F.rain.material.opacity=0.45*FD.rainK;
  if(F.rain.visible){const p=FD.rainPos||F.rainPos,cp=c.position;F.drops.forEach((d,i)=>{d.y-=d.v*dt;d.x-=1.4*dt;
    if(d.y<0){d.y=10+Math.random()*4;d.x=cp.x+(Math.random()-0.5)*30;d.z=cp.z-14+Math.random()*24;}
    const o=i*6;p[o]=d.x;p[o+1]=d.y;p[o+2]=d.z;p[o+3]=d.x+0.08;p[o+4]=d.y+0.55;p[o+5]=d.z;});F.rain.geometry.attributes.position.needsUpdate=true;}
  /* clouds over the moon dim the moonlight */
  let cover=0;F.clouds.forEach((cl,i)=>{const dx=Math.abs(cl.position.x-F.moon.position.x);cover=Math.max(cover,clamp(1-(dx-8)/10,0,1));});
  FD.st.sun.intensity=0.4*(1-cover*0.6);FD.st.hemi.intensity=0.5*(1-cover*0.3);
  FD.fogK+=(FD.fogWant-FD.fogK)*Math.min(1,dt*0.3);FD.st.scene.fog.near=16-FD.fogK*10;FD.st.scene.fog.far=70-FD.fogK*38;
}
function startFieldEvent(k){
  const F=FD.f,e={k,t:0};
  if(k==="crow"){e.side=Math.random()<0.5?-1:1;e.dur=11+Math.random()*6;F.crow.visible=true;}
  if(k==="figure"){e.dir=Math.random()<0.5?-1:1;e.dur=30;e.z=-26-Math.random()*14;F.fig.visible=true;}
  if(k==="fog"){e.dur=24;FD.fogWant=1;F.fogs.forEach((m,i)=>{m.position.x=-34-i*9;});}
  if(k==="cloud"){e.dur=26;F.clouds.forEach((c,i)=>c.position.x=-130-i*16);}
  if(k==="rain"){e.dur=20+Math.random()*15;FD.rainWant=1;}
  FD.ev.push(e);}
function fieldEvent(e,dt){
  const F=FD.f;e.t+=dt;const t=e.t,done=t>=e.dur;
  if(e.k==="crow"){const cr=F.crow,perch=[e.side*1.2,F.roof.position.y+0.32,0.05],from=[e.side*14,7,-12],to=[-e.side*16,9,-6];
    const flap=s=>F.wings.forEach((w,i)=>w.rotation.z=(i?-1:1)*Math.sin(t*s)*0.9);
    if(t<2.4){const q=ease(t/2.4);cr.position.set(lerp(from[0],perch[0],q),lerp(from[1],perch[1],q)+Math.sin(q*Math.PI)*1.5,lerp(from[2],perch[2],q));cr.rotation.y=Math.atan2(perch[0]-from[0],perch[2]-from[2]);flap(18);}
    else if(t<e.dur-2){cr.position.set(...perch);flap(0);F.wings.forEach(w=>w.rotation.z=0);cr.rotation.y=Math.sin(t*0.7)*1.2+(Math.floor(t/2.3)%2?0.6:-0.6);
      if(Math.floor(t/3.1)!==e.c&&Math.random()<0.5){e.c=Math.floor(t/3.1);tone(560,0.12,"sawtooth",0.008,420);tone(520,0.14,"sawtooth",0.008,400,0.18);}}
    else{const q=ease((t-(e.dur-2))/2);cr.position.set(lerp(perch[0],to[0],q),lerp(perch[1],to[1],q),lerp(perch[2],to[2],q));cr.rotation.y=Math.atan2(to[0]-perch[0],to[2]-perch[2]);flap(18);}
    if(done)cr.visible=false;}
  if(e.k==="figure"){const fg=F.fig,x=e.dir*(-36+t*2.4);fg.position.set(x,Math.sin(t*3.4)*0.03,e.z);fg.rotation.y=e.dir*Math.PI/2;fg.rotation.z=Math.sin(t*3.4)*0.03;if(done)fg.visible=false;}
  if(e.k==="fog"){F.fogs.forEach((m,i)=>{m.position.x+=dt*(1.6+i*0.3);m.material.opacity=0.16*Math.sin(Math.min(1,t/e.dur)*Math.PI);});if(t>e.dur*0.6)FD.fogWant=0;}
  if(e.k==="cloud"){F.clouds.forEach((c,i)=>c.position.x+=dt*(4.2+i*0.6));}
  if(e.k==="rain"&&t>e.dur*0.75)FD.rainWant=0;
  return !done;}
$("#title").addEventListener("click",()=>{if(scr.current==="title")leaveTitle();});
function leaveTitle(){$("#title").classList.add("out");try{Kit.sound.ac();}catch(e){}scr.show("board");}
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||e.repeat)return;
  if(scr.current==="title"){if(["Shift","Control","Alt","Meta","Tab","CapsLock"].includes(e.key))return;e.preventDefault();leaveTitle();return;}
  if(scr.current==="board"&&FD.mode==="walk"){e.preventDefault();FD.skip=true;}
});

window.HC={buildWarden,buildPilgrim,buildDimitri,applyRig,B_REST,bake,MUS,music,TRACKS,G,P,BOSSES,FD,startFieldEvent,parryHit,shoot,bossStart,bossDown,THREE};   /* for testing in the console */
scr.show("title");
})();
</script>
