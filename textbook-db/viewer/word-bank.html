<style>
/* Layout: notebook page. Left = book shelf + unit index, right = the open unit as a ruled card with a red margin. */
:root{
 --paper:#f3f6fb; --card:#ffffff; --ink:#1d2a44; --muted:#5d6a84; --rule:#d9e1ee;
 --margin:#d9534f; --accent:#2f6fd6; --ok:#2e8b57; --okbg:#e3f4ea; --fix:#b7791f; --fixbg:#fdf1dc;
 --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,sans-serif; --ja:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#121826;--card:#1a2234;--ink:#e6ebf5;--muted:#9aa6bf;--rule:#2b3650;--margin:#e2726e;--accent:#79a6ff;--ok:#6fcf97;--okbg:#17352a;--fix:#f0b45a;--fixbg:#3a2c14;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#121826;--card:#1a2234;--ink:#e6ebf5;--muted:#9aa6bf;--rule:#2b3650;--margin:#e2726e;--accent:#79a6ff;--ok:#6fcf97;--okbg:#17352a;--fix:#f0b45a;--fixbg:#3a2c14;color-scheme:dark}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px;margin-bottom:16px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,36px);margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0}
.shelf{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.book{border:1.5px solid var(--rule);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit;text-align:left;display:grid;gap:2px;min-width:0}
.book b{font-family:var(--display);font-weight:600}
.book small{color:var(--muted);font-variant-numeric:tabular-nums}
.book[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.book:focus-visible,.unit:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.units{display:grid;gap:4px}
.unit{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:8px;align-items:center;background:none;border:0;border-radius:8px;padding:8px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.unit:hover{background:var(--card)}
.unit[aria-current="true"]{background:var(--card);box-shadow:0 0 0 1.5px var(--rule)}
.unit .p{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.unit .t{min-width:0;overflow-wrap:anywhere}
.pill{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px;white-space:nowrap;background:var(--rule);color:var(--muted)}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.fix{background:var(--fixbg);color:var(--fix)}
.card{background:var(--card);border-radius:14px;border:1px solid var(--rule);padding:20px 20px 20px 44px;position:relative;min-width:0;
 background-image:linear-gradient(var(--margin),var(--margin));background-size:2px 100%;background-position:28px 0;background-repeat:no-repeat}
.card h2{font-family:var(--display);font-weight:800;font-size:clamp(22px,3vw,30px);margin:2px 0 4px;text-wrap:balance}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);margin-bottom:14px}
h3{font-family:var(--display);font-weight:600;font-size:17px;margin:18px 0 8px}
.phrases{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.phrases li{padding:6px 10px;border-bottom:1px dashed var(--rule);font-size:16px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.w{border:1px solid var(--rule);border-radius:10px;padding:8px 10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 8px;align-items:center}
.w .e{font-size:24px;grid-row:span 2;width:1.3em;text-align:center}
.w .en{font-weight:700;overflow-wrap:anywhere}
.w .ja{font-family:var(--ja);color:var(--muted);font-size:13px}
.review{margin-top:22px;padding-top:16px;border-top:1px solid var(--rule);display:grid;gap:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:9px 14px;cursor:pointer;border:1.5px solid var(--rule);background:var(--card);color:var(--ink)}
.btn.ok[aria-pressed="true"]{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.btn.fix[aria-pressed="true"]{background:var(--fixbg);border-color:var(--fix);color:var(--fix)}
textarea{font:inherit;width:100%;box-sizing:border-box;min-height:80px;border-radius:10px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);padding:8px 10px}
.status{font-size:13px;color:var(--muted);min-height:1.4em}
.note{font-size:13px;color:var(--muted);margin-top:12px}
</style>

const GRADE = {ES3:"Grade 3",ES4:"Grade 4",ES5:"Grade 5",ES6:"Grade 6",JHS1:"JHS 1",JHS2:"JHS 2",JHS3:"JHS 3"};
let reviews = {}, db = null, bi = 0, ui = 0;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rid = (b,u) => b.key + "-u" + u.unit;
function pill(r){ if(!r||!r.status) return '<span class="pill">Unchecked</span>';
  return r.status==="ok" ? '<span class="pill ok">Checked</span>' : '<span class="pill fix">Needs fixing</span>'; }
function shelf(){
  $("#shelf").innerHTML = BOOKS.map((b,i)=>{
    const done = b.units.filter(u=>reviews[rid(b,u)]?.status).length;
    return `<button class="book" id="book-${b.key}" aria-pressed="${i===bi}" data-i="${i}"><b>${esc(b.book)}</b><small>${GRADE[b.grade]||b.grade} · ${done}/${b.units.length} checked</small></button>`;
  }).join("");
}
function units(){
  const b = BOOKS[bi];
  $("#units").innerHTML = b.units.map((u,i)=>`<button class="unit" role="listitem" aria-current="${i===ui}" data-i="${i}"><span class="p">p.${u.page}</span><span class="t">${esc(u.title)}</span>${pill(reviews[rid(b,u)])}</button>`).join("");
}
function card(){
  const b = BOOKS[bi], u = b.units[ui], r = reviews[rid(b,u)] || {};
  $("#card").innerHTML = `
   <div class="eyebrow">${esc(b.book)} · ${GRADE[b.grade]||""}</div>
   <h2>${esc(u.title)}</h2>
   <div class="meta"><span>Page ${u.page}</span><span>${esc(u.topic)}</span>${u.grammar&&u.grammar!==u.topic?`<span>Grammar: ${esc(u.grammar)}</span>`:""}</div>
   <h3>Key phrases</h3>
   ${u.phrases.length?`<ul class="phrases">${u.phrases.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`:`<p class="status">No phrases yet.</p>`}
   <h3>Words (${u.words.length})</h3>
   <div class="words">${u.words.map(w=>`<div class="w"><span class="e" aria-hidden="true">${esc(w.emoji||"")}</span><span class="en">${esc(w.en)}</span><span class="ja" lang="ja">${esc(w.ja||"")}</span></div>`).join("")}</div>
   <div class="review">
    <div class="btns">
     <button class="btn ok" id="mark-ok" aria-pressed="${r.status==="ok"}">Matches the book</button>
     <button class="btn fix" id="mark-fix" aria-pressed="${r.status==="fix"}">Needs fixing</button>
    </div>
    <label for="fixnote">What should change? (missing words, wrong phrases, different page)</label>
    <textarea id="fixnote" placeholder="e.g. Add 'eraser'. Phrase should be 'Do you have a pen?'">${esc(r.note||"")}</textarea>
    <div class="btns"><button class="btn" id="save-note">Save note</button></div>
    <div class="status" id="status">${db?"":"Checks are saved when this page is open in Claude."}</div>
   </div>
   <p class="note">Drafted from ALTopedia's page outline and general knowledge of the book. ${esc(b.edition)}.</p>`;
}
function render(){ shelf(); units(); card(); }
async function save(patch){
  const b = BOOKS[bi], u = b.units[ui], id = rid(b,u);
  const next = Object.assign({}, reviews[id]||{}, patch, {book:b.key, unit:u.unit, title:u.title, updatedAt:new Date().toISOString()});
  reviews[id] = next; render();
  if(!db){ $("#status").textContent = "Not saved: checks can only be saved when this page is open in Claude."; return; }
  try{ await db.collection("reviews").doc(id).set(next); $("#status").textContent = "Saved."; }
  catch(e){ $("#status").textContent = "Couldn't save (" + (e.code||"error") + "). Try again in a moment."; }
}
document.addEventListener("click", e=>{
  const bk = e.target.closest(".book"); if(bk){ bi=+bk.dataset.i; ui=0; render(); return; }
  const un = e.target.closest(".unit"); if(un){ ui=+un.dataset.i; render(); if(innerWidth<760) $("#card").scrollIntoView({behavior:"smooth"}); return; }
  if(e.target.id==="mark-ok") save({status:"ok"});
  if(e.target.id==="mark-fix") save({status:"fix", note:$("#fixnote").value});
  if(e.target.id==="save-note") save({note:$("#fixnote").value, status:(reviews[rid(BOOKS[bi],BOOKS[bi].units[ui])]||{}).status||"fix"});
});
render();
(async()=>{
  db = await window.claude?.use?.("db") ?? null;
  if(!db){ render(); return; }
  render();
  db.collection("reviews").onSnapshot(s=>{
    const next={}; s.docs.forEach(d=>next[d.id]=d.data()); 
    const typing = document.activeElement?.id==="fixnote"; reviews=next;
    if(typing){ shelf(); units(); } else render();
  }, err=>{ $("#status").textContent="Couldn't load saved checks ("+(err.code||"error")+")."; });
})();
</script>
